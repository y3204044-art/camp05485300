<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>קעמפ ביה״ז אב פ״ה באופקים</title>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;700&family=Heebo:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    /* עיצוב נוסטלגי וחם */
    :root {
      --bg-color: #1a1512;
      --card-bg: #2d241f;
      --text-main: #f4e8d3;
      --text-muted: #c9bca7;
      --accent-glow: rgba(220, 160, 100, 0.4);
    }

    body {
      margin: 0;
      background: radial-gradient(circle at center, #2a201b 0%, #110d0a 100%);
      color: var(--text-main);
      font-family: 'Heebo', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none; /* חסימת סימון טקסט */
    }

    /* הגנה נגד גרירה ושמירה */
    img, video {
      pointer-events: none; /* הופך את התמונות לבלתי לחיצות לעכבר */
      -webkit-user-drag: none;
    }

    /* כותרת חכמה שמתפוגגת */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 1.5rem 0;
      text-align: center;
      background: linear-gradient(to bottom, rgba(26, 21, 18, 0.95), rgba(26, 21, 18, 0));
      z-index: 100;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    
    header.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-20px);
    }

    h1 {
      font-family: 'Frank Ruhl Libre', serif;
      font-size: 2.5rem;
      margin: 0;
      text-shadow: 0 4px 15px var(--accent-glow);
      letter-spacing: 1px;
    }

    /* כפתור מצגת זכרונות */
    .btn-slideshow {
      margin-top: 10px;
      padding: 8px 20px;
      background: rgba(244, 232, 211, 0.1);
      border: 1px solid var(--text-muted);
      color: var(--text-main);
      border-radius: 30px;
      font-family: 'Heebo', sans-serif;
      cursor: pointer;
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
      font-size: 1rem;
    }

    .btn-slideshow:hover {
      background: var(--text-main);
      color: var(--bg-color);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    /* גלריה במראה וינטג' */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 25px;
      padding: 120px 20px 40px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .media-container {
      position: relative;
      background: #faf4e8; /* מסגרת דמוית פולארויד */
      padding: 10px 10px 40px 10px;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.8s ease, transform 0.8s ease, box-shadow 0.3s ease;
    }

    /* טעינה חלקה - האובייקטים נחשפים בריחוף */
    .media-container.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .media-container:hover {
      box-shadow: 0 15px 40px rgba(220, 160, 100, 0.3);
      transform: translateY(-5px) scale(1.02);
      z-index: 10;
    }

    .media-item {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 2px;
      background: #111;
      filter: sepia(0.2) contrast(1.1); /* פילטר נוסטלגי עדין */
      transition: filter 0.3s ease;
    }

    .media-container:hover .media-item {
      filter: sepia(0) contrast(1); /* חזרה לצבע מקורי במעבר עכבר */
    }

    /* שכבת הגנה נגד גניבות (Overlay) */
    .protection-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 5;
    }

    /* מצב מצגת מסך מלא */
    #slideshow-modal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #050403;
      z-index: 999;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }

    #slideshow-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    #slideshow-media {
      max-width: 90%;
      max-height: 90%;
      box-shadow: 0 0 50px rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      opacity: 0;
      transition: opacity 1.5s ease-in-out; /* מעבר איטי ומרגש */
    }

    #slideshow-media.fade-in {
      opacity: 1;
    }

    .close-slideshow {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      z-index: 1000;
      opacity: 0.5;
    }
    
    .close-slideshow:hover {
      opacity: 1;
    }

    /* מסתיר אלמנטים כשאין מדיה */
    .loading-text {
      text-align: center;
      grid-column: 1 / -1;
      font-size: 1.2rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header id="main-header">
    <h1>קעמפ ביה״ז אב פ״ה באופקים</h1>
    <button class="btn-slideshow" onclick="startSlideshow()">🎞️ מצגת זכרונות (Remembering This)</button>
  </header>

  <div id="gallery" class="gallery">
    <div class="loading-text">טוען זכרונות...</div>
  </div>

  <!-- מצגת מסך מלא -->
  <div id="slideshow-modal">
    <div class="close-slideshow" onclick="stopSlideshow()">✖</div>
    <div class="protection-overlay" style="z-index: 10;"></div>
    <!-- המדיה תוזרק לכאן דינמית -->
  </div>

  <script>
    // --- הגנות תוכן הרמטיות ---
    document.addEventListener('contextmenu', event => event.preventDefault()); // חסימת קליק ימני
    document.addEventListener('keydown', (e) => {
      // חסימת קיצורי מקלדת כמו שמירה ופתיחת קוד מקור
      if (e.ctrlKey && (e.key === 's' || e.key === 'u' || e.key === 'p')) e.preventDefault();
      if (e.metaKey && (e.key === 's' || e.key === 'u' || e.key === 'p')) e.preventDefault();
      if (e.key === 'F12') e.preventDefault();
    });

    // --- העלמת כותרת בגלילה ---
    let lastScroll = 0;
    const header = document.getElementById('main-header');
    window.addEventListener('scroll', () => {
      const currentScroll = window.scrollY;
      if (currentScroll > 100) {
        header.classList.add('hidden');
      } else {
        header.classList.remove('hidden');
      }
      lastScroll = currentScroll;
    });

    // --- טעינת המדיה מגיטהאב (אוטומטי) ---
    const repoOwner = "y3204044-art";
    const repoName = "camp05485300-gmail.com";
    const mediaFolder = "media";
    const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${mediaFolder}`;

    let allMediaData = []; // נשמור את הקבצים עבור המצגת

    async function loadMedia() {
      const gallery = document.getElementById('gallery');
      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error("לא נמצאה תיקיית media");
        const files = await response.json();
        
        gallery.innerHTML = ""; // ניקוי טקסט הטעינה
        
        // יצירת מנגנון צפייה שחושף תמונות בגלילה
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('visible');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1 });

        files.forEach(file => {
          if (file.type === "file") {
            const isVideo = file.name.match(/\.(mp4|webm|mov)$/i);
            const isImage = file.name.match(/\.(jpeg|jpg|gif|png|webp)$/i);
            const downloadUrl = file.download_url;

            if (isVideo || isImage) {
              allMediaData.push({ url: downloadUrl, isVideo }); // שמירה למצגת

              const container = document.createElement('div');
              container.className = 'media-container';
              
              // שכבת הגנה פנימית נגד לחיצות
              const overlay = document.createElement('div');
              overlay.className = 'protection-overlay';
              
              if (isVideo) {
                const video = document.createElement('video');
                video.src = downloadUrl;
                video.className = 'media-item';
                video.muted = true;
                video.loop = true;
                // סרטון יתנגן אוטומטית כשהעכבר יעבור מעליו (נמצא מתחת ל-overlay)
                container.addEventListener('mouseenter', () => video.play().catch(e=>{}));
                container.addEventListener('mouseleave', () => video.pause());
                container.appendChild(video);
              } else {
                const img = document.createElement('img');
                img.src = downloadUrl;
                img.className = 'media-item';
                img.loading = 'lazy'; // טעינה עצלנית למהירות
                container.appendChild(img);
              }
              
              container.appendChild(overlay);
              gallery.appendChild(container);
              observer.observe(container); // חיבור לאנימציית החשיפה
            }
          }
        });

        if (allMediaData.length === 0) {
          gallery.innerHTML = "<div class='loading-text'>לא נמצאו תמונות או סרטונים בתיקיית media.</div>";
        }

      } catch (error) {
        gallery.innerHTML = `<div class='loading-text'>שגיאה בטעינת המדיה. ודא שקיימת תיקייה בשם media עם קבצים.</div>`;
      }
    }

    // --- לוגיקת המצגת האוטומטית (Remembering This) ---
    let slideshowInterval;
    let currentSlide = 0;
    const modal = document.getElementById('slideshow-modal');

    function startSlideshow() {
      if (allMediaData.length === 0) return;
      modal.classList.add('active');
      currentSlide = 0;
      showNextSlide();
    }

    function showNextSlide() {
      if (!modal.classList.contains('active')) return;

      // ניקוי המדיה הקודמת
      const existingMedia = document.getElementById('slideshow-media');
      if (existingMedia) {
        existingMedia.classList.remove('fade-in');
        setTimeout(() => existingMedia.remove(), 1000); // מחכה לסיום ההתפוגגות
      }

      setTimeout(() => {
        const item = allMediaData[currentSlide];
        let mediaElement;

        if (item.isVideo) {
          mediaElement = document.createElement('video');
          mediaElement.src = item.url;
          mediaElement.autoplay = true;
          mediaElement.muted = false; // סאונד פועל במצגת
          mediaElement.onended = () => {
             // כשמסתיים הסרטון, עוברים לבא
             currentSlide = (currentSlide + 1) % allMediaData.length;
             showNextSlide();
          };
        } else {
          mediaElement = document.createElement('img');
          mediaElement.src = item.url;
          // בתמונה, מחכים 5 שניות ואז מחליפים
          slideshowInterval = setTimeout(() => {
            currentSlide = (currentSlide + 1) % allMediaData.length;
            showNextSlide();
          }, 5000); 
        }

        mediaElement.id = 'slideshow-media';
        modal.appendChild(mediaElement);
        
        // טריגר קטן כדי שהאנימציה של החשיפה תעבוד
        setTimeout(() => mediaElement.classList.add('fade-in'), 50);

      }, 1000);
    }

    function stopSlideshow() {
      modal.classList.remove('active');
      clearTimeout(slideshowInterval);
      const existingMedia = document.getElementById('slideshow-media');
      if (existingMedia) {
        if(existingMedia.tagName === 'VIDEO') existingMedia.pause();
        existingMedia.remove();
      }
    }

    // התנעת הטעינה כשהעמוד נפתח
    window.onload = loadMedia;
  </script>
</body>
</html>
