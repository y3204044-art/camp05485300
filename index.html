<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>קעמפ ביה״ז אב פ״ה באופקים</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://wsrv.nl">
  
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;800;900&family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/y3204044-art/camp05485300-gmail.com/main/logo.JPG">
  
  <style>
    :root {
      --bg-dark: #070d1e;
      --bg-panel: rgba(12, 22, 50, 0.85);
      --radius-large: 20px;
      --google-blue: #4285f4;
      --google-red: #ea4335;
      --google-yellow: #fbbc05;
      --google-green: #34a853;
      --neon-pink: #ff007f;
      --neon-cyan: #00f0ff;
    }

    * { 
      box-sizing: border-box; 
      cursor: url('https://wsrv.nl/?url=raw.githubusercontent.com/y3204044-art/camp05485300-gmail.com/main/logo.JPG&w=28&h=28&fit=cover&mask=circle') 14 14, auto !important;
    }

    body {
      margin: 0; background-color: var(--bg-dark); color: #fff;
      font-family: 'Heebo', sans-serif; overflow-x: hidden; min-height: 100vh;
      user-select: none; -webkit-user-drag: none;
    }
    
    body.locked, body.no-scroll { overflow: hidden; }

    #login-gate {
      position: fixed; inset: 0; z-index: 9999999;
      background: radial-gradient(circle at center, #0c1c42 0%, #02050d 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: all 1s cubic-bezier(0.25, 1, 0.25, 1);
    }
    
    #login-gate::before, #login-gate::after {
      content: ''; position: absolute; width: 40vw; height: 40vw; border-radius: 50%;
      filter: blur(100px); z-index: -1; animation: floatBlobs 10s infinite alternate ease-in-out;
    }
    #login-gate::before { background: rgba(0, 240, 255, 0.15); top: -10%; left: -10%; }
    #login-gate::after { background: rgba(255, 0, 127, 0.15); bottom: -10%; right: -10%; animation-delay: -5s; }

    @keyframes floatBlobs { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 50px) scale(1.2); } }

    #login-gate.unlocked { transform: scale(1.5); opacity: 0; pointer-events: none; filter: blur(15px); }

    .login-box {
      background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      padding: 50px 40px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.05);
      text-align: center; display: flex; flex-direction: column; align-items: center;
      animation: floatBox 4s infinite alternate ease-in-out;
    }
    @keyframes floatBox { 0% { transform: translateY(0); } 100% { transform: translateY(-10px); } }

    .login-logo {
      width: 120px; height: 120px; border-radius: 50%; margin-bottom: 25px; object-fit: cover;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
      animation: spinBorder 4s linear infinite; padding: 4px;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
    }

    .gate-title {
      font-family: 'Fredoka', sans-serif; font-size: clamp(1.8rem, 4vw, 2.5rem); font-weight: 900;
      color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.5); margin: 0 0 30px 0; letter-spacing: 1px;
    }

    .input-wrapper { position: relative; width: 100%; max-width: 260px; margin-bottom: 25px; }
    .input-wrapper svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; fill: rgba(255,255,255,0.5); transition: 0.3s; }
    
    .gate-input {
      width: 100%; padding: 15px 20px 15px 50px; font-size: 1.5rem; text-align: center;
      border: 2px solid rgba(255,255,255,0.1); border-radius: 30px; background: rgba(0,0,0,0.3);
      color: #fff; outline: none; transition: all 0.3s; direction: ltr; letter-spacing: 5px;
    }
    .gate-input:focus { border-color: var(--neon-cyan); background: rgba(0,0,0,0.5); box-shadow: 0 0 20px rgba(0,240,255,0.2); }
    .gate-input:focus + svg { fill: var(--neon-cyan); }

    .gate-btn {
      padding: 14px 40px; font-size: 1.3rem; font-family: 'Fredoka', sans-serif; font-weight: 800;
      color: #fff; background: linear-gradient(135deg, var(--google-blue), var(--neon-cyan));
      border: none; border-radius: 30px; cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 240, 255, 0.3); transition: all 0.3s; width: 100%; max-width: 260px;
    }
    .gate-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(0, 240, 255, 0.5); }

    .loading-disclaimer {
      font-family: 'Heebo', sans-serif;
      font-size: 0.9rem; font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 25px; max-width: 280px; line-height: 1.4;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
      animation: pulseText 2s infinite alternate ease-in-out;
    }
    @keyframes pulseText { 0% { opacity: 0.6; } 100% { opacity: 1; text-shadow: 0 0 12px rgba(0, 240, 255, 0.6); } }

    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px) rotate(-1deg); border-color: var(--google-red); }
      50% { transform: translateX(10px) rotate(1deg); }
      75% { transform: translateX(-10px) rotate(-1deg); }
    }

    #main-app {
      opacity: 0; transform: scale(0.95); filter: blur(10px);
      transition: all 1s cubic-bezier(0.25, 1, 0.25, 1); transition-delay: 0.1s;
    }
    body.unlocked #main-app { opacity: 1; transform: scale(1); filter: blur(0); pointer-events: auto; }

    .bg-spotlights {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
      overflow: hidden; pointer-events: none;
      background: radial-gradient(circle at 50% 30%, #0c1c42 0%, #040814 100%);
    }
    .light-beam {
      position: absolute; top: -200px; width: 350px; height: 1200px;
      background: linear-gradient(180deg, rgba(0, 240, 255, 0.25) 0%, rgba(255, 0, 127, 0.15) 50%, transparent 100%);
      filter: blur(50px); transform-origin: top center; animation: beamSweep 16s infinite alternate ease-in-out;
    }
    .light-beam:nth-child(1) { left: 10%; animation-delay: 0s; }
    .light-beam:nth-child(2) { left: 45%; background: linear-gradient(180deg, rgba(251, 188, 5, 0.25) 0%, rgba(52, 168, 83, 0.15) 50%, transparent 100%); animation-delay: -5s; }
    .light-beam:nth-child(3) { left: 75%; animation-delay: -10s; }
    @keyframes beamSweep { 0% { transform: rotate(-25deg) scaleX(1); opacity: 0.4; } 50% { transform: rotate(0deg) scaleX(1.3); opacity: 0.8; } 100% { transform: rotate(25deg) scaleX(1); opacity: 0.4; } }

    /* שכבת הזיקוקים - פועלת תמיד ובכל מקום */
    #fireworks-container {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 9999; overflow: hidden;
    }
    .firework-particle {
      position: absolute; border-radius: 50%;
      animation: explodeParticle 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
    @keyframes explodeParticle {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

    header {
      position: sticky; top: 0; width: 100%; padding: 12px 15px 10px;
      background: rgba(7, 13, 30, 0.94); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 2px solid var(--google-yellow); z-index: 100; text-align: center; transition: transform 0.4s ease;
      box-shadow: 0 10px 35px rgba(0,0,0,0.8);
    }
    header.hidden { transform: translateY(-100%); }

    .header-top-row { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 6px; position: relative; }

    .header-logo {
      width: 80px; height: 80px; border-radius: 50%; object-fit: cover;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.9), 0 0 40px rgba(255, 0, 127, 0.6);
      animation: logoGlow 3s infinite alternate ease-in-out; position: relative; z-index: 2;
    }
    @media(min-width: 768px) { .header-logo { width: 100px; height: 100px; } }
    @keyframes logoGlow { 
      0% { transform: scale(1) rotate(0deg); box-shadow: 0 0 20px rgba(0, 240, 255, 0.9), 0 0 40px rgba(255, 0, 127, 0.6); } 
      100% { transform: scale(1.15) rotate(5deg); box-shadow: 0 0 35px rgba(251, 188, 5, 1), 0 0 65px rgba(0, 240, 255, 0.9); } 
    }

    /* כותרת שמנמנה ואנימציית הקלדה */
    .title-wrapper { display: inline-block; white-space: nowrap; }
    h1 {
      font-family: 'Fredoka', 'Heebo', sans-serif; font-weight: 900; 
      font-size: clamp(2rem, 5.5vw, 3.5rem); margin: 0; line-height: 1.1; letter-spacing: 1px;
      display: flex; justify-content: center; flex-wrap: nowrap;
      -webkit-text-stroke: 2.5px rgba(255, 255, 255, 0.6); 
    }
    .char {
      display: inline-block; animation: typeAndBounce 3.5s infinite ease-in-out;
      text-shadow: 0 5px 12px rgba(0,0,0,0.9), 0 0 20px currentColor, 0 0 35px currentColor;
    }
    @keyframes typeAndBounce { 
      0%, 10% { transform: translateY(10px) scale(0.3); opacity: 0; } 
      15% { transform: translateY(-15px) scale(1.2); opacity: 1; } 
      22%, 90% { transform: translateY(0) scale(1); opacity: 1; } 
      100% { transform: translateY(10px) scale(0.3); opacity: 0; } 
    }

    .controls-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 10px; }
    .btn-group { display: flex; background: rgba(0, 0, 0, 0.6); border-radius: var(--radius-large); padding: 4px; border: 1px solid rgba(255, 255, 255, 0.12); }
    .btn { background: transparent; color: #ccc; border: none; padding: 6px 14px; border-radius: var(--radius-large); font-family: inherit; font-size: 0.85rem; font-weight: 700; transition: all 0.2s ease; }
    .btn:hover { color: #fff; background: rgba(255, 255, 255, 0.15); }
    .btn.active { background: linear-gradient(135deg, var(--google-blue), #00d2ff); color: #fff; box-shadow: 0 0 12px rgba(0, 210, 255, 0.6); }

    .featured-container { max-width: 1600px; margin: 15px auto 10px; padding: 0 15px; }
    .featured-grid { display: grid; grid-template-columns: repeat(1, 1fr); gap: 15px; }
    @media (min-width: 600px) { .featured-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .featured-grid { grid-template-columns: repeat(4, 1fr); } }

    .featured-card {
      position: relative; background: var(--bg-panel); border-radius: 14px; overflow: hidden;
      border: 2px solid var(--neon-cyan); box-shadow: 0 0 18px rgba(0, 240, 255, 0.4), 0 6px 20px rgba(0,0,0,0.8);
      transition: all 0.3s ease; display: flex; flex-direction: column;
    }
    .featured-card:hover { border-color: var(--google-yellow); box-shadow: 0 0 25px rgba(251, 188, 5, 0.6), 0 8px 25px rgba(0,0,0,0.9); transform: translateY(-2px); }
    .featured-card.expanded { grid-column: 1 / -1; max-width: 1000px; margin: 0 auto; width: 100%; }
    
    .featured-card.css-fullscreen {
      position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important;
      max-width: none !important; z-index: 99999 !important; border-radius: 0 !important; background: #000 !important; margin: 0 !important; justify-content: center;
    }
    .featured-card:fullscreen, .featured-card.css-fullscreen { border: none !important; box-shadow: none !important; }
    .featured-card:fullscreen .featured-video-box, .featured-card.css-fullscreen .featured-video-box { flex: 1; height: 100% !important; aspect-ratio: auto !important; }

    .featured-header {
      padding: 8px 12px; background: linear-gradient(90deg, rgba(255,0,127,0.4), rgba(0,240,255,0.4));
      display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 0.88rem; border-bottom: 1px solid rgba(255,255,255,0.15);
    }
    .featured-header-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }

    .featured-footer { padding: 8px 10px; background: rgba(5, 12, 30, 0.9); display: flex; justify-content: flex-end; align-items: center; border-top: 1px solid rgba(255,255,255,0.08); }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .fullscreen-btn {
      background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff; border-radius: 6px; padding: 5px 12px; font-size: 0.8rem; font-family: inherit; font-weight: 700; cursor: pointer; transition: all 0.2s ease; white-space: nowrap;
    }
    .fullscreen-btn:hover { background: var(--google-blue); border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0, 240, 255, 0.8); }

    .featured-video-box { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #000; }
    .featured-video-box iframe { position: absolute; top: -48px; left: 0; width: 100%; height: calc(100% + 48px); border: none; display: block; z-index: 5; }
    .drive-guard { position: absolute; top: 0; left: 0; width: 100%; height: 48px; z-index: 10; background: transparent; pointer-events: auto; }
    .video-duration-badge { position: absolute; top: 8px; left: 8px; z-index: 15; background: rgba(5, 12, 30, 0.88); backdrop-filter: blur(8px); color: var(--neon-cyan); border: 1px solid rgba(0, 240, 255, 0.5); padding: 3px 9px; border-radius: 6px; font-size: 0.78rem; font-weight: 700; }
    .video-cover-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 12;
      background: linear-gradient(135deg, rgba(7, 13, 30, 0.5) 0%, rgba(12, 28, 66, 0.75) 100%), url('https://wsrv.nl/?url=raw.githubusercontent.com/y3204044-art/camp05485300-gmail.com/main/logo.JPG&w=800') center/cover;
      display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; gap: 10px; transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .video-cover-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .play-trigger-btn { width: 58px; height: 58px; border-radius: 50%; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink)); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; color: #fff; box-shadow: 0 0 22px rgba(0, 240, 255, 0.8); transition: transform 0.3s ease; padding-left: 3px; }
    .video-cover-overlay:hover .play-trigger-btn { transform: scale(1.15); }

    .gallery-container { display: grid; padding: 15px 20px 40px; max-width: 1800px; margin: 0 auto; min-height: 200px; }
    .gallery-container[data-size="small"] { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .gallery-container[data-size="medium"] { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
    .gallery-container[data-size="large"] { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    
    .gallery-container.masonry-mode { display: block; column-gap: 12px; }
    .gallery-container.masonry-mode[data-size="small"] { columns: 6 130px; }
    .gallery-container.masonry-mode[data-size="medium"] { columns: 4 220px; }
    .gallery-container.masonry-mode[data-size="large"] { columns: 3 320px; }

    .gallery-container.masonry-mode .media-card { margin-bottom: 12px; break-inside: avoid; display: inline-block; width: 100%; }

    .media-card {
      position: relative; background: linear-gradient(45deg, #0a1532, #16244d); border-radius: 12px; overflow: hidden;
      border: 2px solid #1c2d5a; box-shadow: 0 4px 14px rgba(0,0,0,0.5);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease; z-index: 1;
      background-size: 200% 200%; animation: skeletonPulse 2.5s infinite ease-in-out; cursor: pointer;
    }
    @keyframes skeletonPulse { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    .media-card:hover { transform: scale(1.035); border-color: var(--google-yellow); box-shadow: 0 8px 22px rgba(0,0,0,0.8), 0 0 15px rgba(251, 188, 5, 0.4); z-index: 10; }

    .media-item { width: 100%; height: 100%; display: block; object-fit: cover; transition: opacity 0.5s ease; opacity: 0; pointer-events: none;}
    .media-item.loaded { opacity: 1; }

    .gallery-container:not(.masonry-mode) .media-card { aspect-ratio: 16 / 9; }
    .gallery-container.masonry-mode .media-item { aspect-ratio: auto; }

    .video-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2.2rem; color: #fff; text-shadow: 0 0 15px var(--neon-cyan), 0 0 10px #000; pointer-events: none; z-index: 5; transition: opacity 0.2s; }
    .media-card:hover .video-icon { opacity: 0.2; }

    /* תווית זמן עגלגלה לוידאו */
    .video-duration-tag {
      position: absolute; bottom: 8px; right: 8px; z-index: 6;
      background: rgba(0,0,0,0.65); color: var(--google-yellow);
      font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 0.85rem;
      padding: 3px 10px; border-radius: 12px; pointer-events: none;
      box-shadow: 0 2px 5px rgba(0,0,0,0.8); border: 1px solid rgba(251, 188, 5, 0.3);
    }

    .fancy-loader { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; }
    .fancy-loader .spinner { width: 60px; height: 60px; border-radius: 50%; border: 5px solid rgba(0, 240, 255, 0.2); border-top-color: var(--neon-cyan); animation: spin 1s linear infinite; margin-bottom: 20px; box-shadow: 0 0 20px rgba(0,240,255,0.4); }
    .fancy-loader h3 { color: #fff; font-family: 'Fredoka', sans-serif; font-size: 1.5rem; text-shadow: 0 0 10px var(--neon-cyan); margin: 0;}
    @keyframes spin { to { transform: rotate(360deg); } }

    #lightbox {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100dvh;
      background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      z-index: 1000000; display: flex; justify-content: center; align-items: center;
      opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
    }
    #lightbox.active { opacity: 1; pointer-events: auto; }
    
    #lightbox-media-container { 
      position: absolute; inset: 0; 
      display: flex; justify-content: center; align-items: center; padding: 0; 
    }
    
    #lightbox-content { 
      max-width: 90vw; max-height: 90dvh; width: auto; height: auto; 
      border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: none; 
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.3s ease; 
      object-fit: contain; margin: auto; display: block;
    }
    
    .close-btn, .nav-btn {
      position: absolute; z-index: 100000; display: flex; justify-content: center; align-items: center;
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      color: #fff; border-radius: 50%; cursor: pointer; transition: all 0.3s ease;
    }
    .close-btn { top: 25px; right: 25px; width: 55px; height: 55px; }
    .close-btn svg { width: 26px; height: 26px; fill: currentColor; }
    .close-btn:hover { background: rgba(234, 67, 53, 0.9); box-shadow: 0 0 25px rgba(234, 67, 53, 0.8); transform: scale(1.1) rotate(90deg); border-color: transparent; }
    
    .nav-btn { top: 50%; transform: translateY(-50%); width: 65px; height: 65px; }
    .nav-btn svg { width: 32px; height: 32px; fill: currentColor; }
    .nav-btn:hover { background: rgba(255, 255, 255, 0.2); transform: translateY(-50%) scale(1.1); border-color: transparent; }
    .prev-btn { right: 25px; }
    .next-btn { left: 25px; }

    /* עיצוב הנגן המותאם אישית */
    .modern-video-wrapper { position: relative; max-width: 90vw; max-height: 90dvh; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.8); animation: popIn 0.35s cubic-bezier(0.25, 1, 0.25, 1); background: #000; display: flex; justify-content: center; align-items: center; }
    @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .modern-video-wrapper video { display: block; width: 100%; height: 100%; max-height: 90dvh; object-fit: contain; outline: none; border: none; pointer-events: auto; }
    .modern-video-wrapper video::-webkit-media-controls { display: none !important; }
    
    .video-controls-overlay { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(0,0,0,0.95), transparent); padding: 50px 20px 20px; display: flex; flex-direction: column; gap: 12px; opacity: 0; transition: opacity 0.35s ease; z-index: 10; pointer-events: auto; }
    .modern-video-wrapper:hover .video-controls-overlay, .modern-video-wrapper.show-controls .video-controls-overlay { opacity: 1; }
    
    .big-play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 75px; height: 75px; border-radius: 50%; background: rgba(0, 240, 255, 0.2); border: 2px solid var(--neon-cyan); color: var(--neon-cyan); display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.3s ease; opacity: 0; pointer-events: none; z-index: 5; }
    .modern-video-wrapper.paused .big-play-btn { opacity: 1; pointer-events: auto; }
    .big-play-btn:hover { background: rgba(0, 240, 255, 0.4); transform: translate(-50%, -50%) scale(1.1); box-shadow: 0 0 20px rgba(0, 240, 255, 0.5); }
    .big-play-btn svg { width: 35px; height: 35px; fill: currentColor; margin-left: 5px; }

  <script>
    document.addEventListener('contextmenu', e => e.preventDefault());

    // מערכת זיקוקים משודרגת
    function createFireworksParty() {
      const container = document.getElementById('fireworks-container');
      if(document.body.classList.contains('locked')) {
        setTimeout(createFireworksParty, 1500); // זיקוקים במסך הפתיחה
        return;
      }
      setTimeout(createFireworksParty, 2500); // תדירות קבועה
      
      const fwX = Math.random() * 100;
      const fwY = Math.random() * 40 + 10;
      const colors = ['#ff007f', '#00f0ff', '#fbbc05', '#34a853', '#ffffff', '#ea4335'];
      const numParticles = 30 + Math.random() * 20;

      for (let i = 0; i < numParticles; i++) {
        const particle = document.createElement('div');
        particle.className = 'firework-particle';
        const color = colors[Math.floor(Math.random() * colors.length)];
        const size = 3 + Math.random() * 6;
        
        particle.style.width = size + 'px';
        particle.style.height = size + 'px';
        particle.style.backgroundColor = color;
        particle.style.boxShadow = `0 0 10px ${color}`;
        
        particle.style.left = fwX + 'vw';
        particle.style.top = fwY + 'vh';
        
        const angle = Math.random() * Math.PI * 2;
        const velocity = 50 + Math.random() * 150;
        const tx = Math.cos(angle) * velocity;
        const ty = Math.sin(angle) * velocity + 50; // תוספת 50 לאפקט נפילה (כבידה)
        
        particle.style.setProperty('--tx', tx + 'px');
        particle.style.setProperty('--ty', ty + 'px');
        
        container.appendChild(particle);
        setTimeout(() => particle.remove(), 1200);
      }
    }
    createFireworksParty();

    const passInput = document.getElementById('pass-input');
    passInput.addEventListener('keypress', function(e) { if(e.key === 'Enter') checkPassword(); });

    function checkPassword() {
      if(passInput.value === '123') {
        const gate = document.getElementById('login-gate');
        gate.classList.add('unlocked');
        document.body.classList.remove('locked');
        document.body.classList.add('unlocked');
        setTimeout(() => { gate.style.display = 'none'; }, 1000); 
      } else {
        const box = document.querySelector('.login-box');
        box.style.animation = 'shakeError 0.4s';

      }
    }

    // פונקציות הוידאו המוצג במסך הראשי
    function toggleCardExpand(btn) {
      const card = btn.closest('.featured-card');
      card.classList.toggle('expanded');
      btn.textContent = card.classList.contains('expanded') ? '✖ מזער' : '🔍 הרחב';
    }

    function toggleCardFullscreen(btn) {
      const card = btn.closest('.featured-card');
      if (card.classList.contains('css-fullscreen')) { card.classList.remove('css-fullscreen'); btn.textContent = '⛶ מסך מלא'; return; }
      if (!document.fullscreenElement) {
        try {
          const req = card.requestFullscreen ? card.requestFullscreen() : (card.webkitRequestFullscreen ? card.webkitRequestFullscreen() : null);
          if (req && req.catch) req.catch(() => { card.classList.add('css-fullscreen'); btn.textContent = '✖ צא'; });
          else if (!req) { card.classList.add('css-fullscreen'); btn.textContent = '✖ צא'; }
        } catch (e) { card.classList.add('css-fullscreen'); btn.textContent = '✖ צא'; }
      } else document.exitFullscreen().catch(()=>{});
    }

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        document.querySelectorAll('.featured-card').forEach(c => {
          c.classList.remove('css-fullscreen');
          c.querySelectorAll('.fullscreen-btn').forEach(btn => { if(btn.textContent.includes('צא')) btn.textContent = '⛶ מסך מלא'; });
        });
      }
    });

    // אנימציית הכותרת
    (function colorizeTitle() {
      const el = document.querySelector('.title-wrapper');
      if (!el) return;
      const palette = ['#ea4335', '#4285f4', '#fbbc05', '#34a853', '#ff007f', '#00f0ff', '#ff9f00'];
      const text = el.textContent; let i = 0;
      el.innerHTML = text.split('').map(ch => {
        if (ch === ' ') return '&nbsp;';
        const color = palette[i % palette.length]; const delay = (i * 0.08).toFixed(2); i++;
        return `<span class="char" style="color:${color}; animation-delay: ${delay}s">${ch}</span>`;
      }).join('');
    })();

    let lastScroll = 0; const header = document.getElementById('main-header');
    window.addEventListener('scroll', () => {
      const currentScroll = window.scrollY;
      if (currentScroll > 80) header.classList.add('hidden'); else header.classList.remove('hidden');
      lastScroll = currentScroll;
    }, {passive: true});

    let allMedia = [], filteredMedia = [], currentBatchIndex = 0, currentLightboxIndex = -1;
    const BATCH_SIZE = 24, galleryEl = document.getElementById('gallery'), sentinel = document.getElementById('scroll-sentinel');
    let isRendering = false;

    const lazyMediaObserver = new IntersectionObserver((entries, obs) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const media = entry.target;
          if (media.dataset.src) {
            media.src = media.dataset.src;
            media.onload = () => media.classList.add('loaded');
            media.onloadeddata = () => media.classList.add('loaded');
            if (media.readyState >= 1) media.classList.add('loaded');
            media.removeAttribute('data-src');
          }
          obs.unobserve(media);
        }
      });
    }, { rootMargin: '1000px' });

    async function fetchFromGitHub() {
      if (galleryEl) galleryEl.innerHTML = `<div class="fancy-loader"><div class="spinner"></div><h3>מתחבר למאגר התמונות...</h3></div>`;
      let filePaths = [];
      try {
        const res = await fetch('https://api.github.com/repos/y3204044-art/camp05485300-gmail.com/git/trees/main?recursive=1');
        if (res.ok) { const data = await res.json(); if (data && data.tree) filePaths = data.tree.filter(f => f.type === 'blob').map(f => f.path); }
      } catch (err) {}

      if (filePaths.length === 0) {
        try {
          const res = await fetch('https://data.jsdelivr.com/v1/packages/gh/y3204044-art/camp05485300-gmail.com@main?structure=flat');
          if (res.ok) { const data = await res.json(); if (data && data.files) filePaths = data.files.map(f => f.name.replace(/^\//, '')); }
        } catch (err) {}
      }

      const mediaPaths = filePaths.filter(path => path.match(/\.(jpg|jpeg|png|gif|webp|mp4|webm|mov|m4v|ogg)$/i));
      if (mediaPaths.length === 0) {
        if (galleryEl) galleryEl.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #ff4a4a;">שגיאה. נסה לרענן.</div>`; return;
      }

      allMedia = mediaPaths.map(path => {
        const rawUrl = `https://cdn.jsdelivr.net/gh/y3204044-art/camp05485300-gmail.com@main/${path}`;
        const isVideo = !!path.match(/\.(mp4|webm|mov|m4v|ogg)$/i);
        const thumbUrl = isVideo ? rawUrl : `https://wsrv.nl/?url=${encodeURIComponent(rawUrl)}&w=500&output=webp`;
        return { url: rawUrl, isVideo, thumb: thumbUrl };
      });
      allMedia.sort(() => Math.random() - 0.5); filteredMedia = [...allMedia];
      galleryEl.innerHTML = ''; currentBatchIndex = 0; await checkAndLoadMore();
    }

    async function renderBatch() {
      if (isRendering || currentBatchIndex >= filteredMedia.length) return;
      isRendering = true;
      const fragment = document.createDocumentFragment();
      const end = Math.min(currentBatchIndex + BATCH_SIZE, filteredMedia.length);
      
      for (let i = currentBatchIndex; i < end; i++) {
        const item = filteredMedia[i];
        const card = document.createElement('div');
        card.className = 'media-card';
        card.onclick = () => openLightbox(i);

        if (item.isVideo) {
          const videoWrap = document.createElement('div');
          videoWrap.style.width = '100%'; videoWrap.style.height = '100%'; videoWrap.style.position = 'relative';
          
          const video = document.createElement('video');
          video.dataset.src = item.thumb; video.className = 'media-item'; video.muted = true; video.loop = true; 
          video.preload = 'metadata'; // טוען תצוגה מקדימה!
          
          const durationTag = document.createElement('div');
          durationTag.className = 'video-duration-tag';
          durationTag.style.display = 'none';

          video.addEventListener('loadedmetadata', () => {
            if(video.duration && video.duration !== Infinity) {
              const m = Math.floor(video.duration / 60);
              const s = Math.floor(video.duration % 60).toString().padStart(2, '0');
              durationTag.textContent = `${m}:${s}`;
              durationTag.style.display = 'block';
            }
          });

          let playPromise;
          card.onmouseenter = () => { playPromise = video.play().catch(()=>{}); };
          card.onmouseleave = () => { if(playPromise) playPromise.then(()=>video.pause()).catch(()=>{}); };
          
          videoWrap.appendChild(video);
          videoWrap.appendChild(durationTag);
          card.appendChild(videoWrap);
          
          const icon = document.createElement('div'); icon.className = 'video-icon'; icon.innerHTML = '▶'; card.appendChild(icon);
          lazyMediaObserver.observe(video);
        } else {
          const img = document.createElement('img');
          img.className = 'media-item'; img.dataset.src = item.thumb; img.setAttribute('decoding', 'async');
          img.onerror = () => { img.src = item.url; };
          card.appendChild(img); lazyMediaObserver.observe(img);
        }
        fragment.appendChild(card);
      }
      galleryEl.appendChild(fragment); currentBatchIndex = end; isRendering = false;
    }

    async function checkAndLoadMore() {
      if (isRendering || currentBatchIndex >= filteredMedia.length) return;
      const scrollBottom = window.innerHeight + window.scrollY;
      const docHeight = document.documentElement.scrollHeight || document.documentElement.offsetHeight;
      if (docHeight - scrollBottom < 1500 || window.innerHeight >= docHeight) { await renderBatch(); setTimeout(checkAndLoadMore, 100); }
    }
    window.addEventListener('scroll', checkAndLoadMore, { passive: true });
    window.addEventListener('resize', checkAndLoadMore, { passive: true });
    new IntersectionObserver(entries => { if (entries[0].isIntersecting) checkAndLoadMore(); }, { rootMargin: '1000px 0px' }).observe(sentinel);

    function setSize(size, btn) { document.querySelector('.gallery-container').setAttribute('data-size', size); updateActiveBtn(btn); checkAndLoadMore(); }
    function setLayout(layout, btn) { const gal = document.querySelector('.gallery-container'); if (layout === 'masonry') gal.classList.add('masonry-mode'); else gal.classList.remove('masonry-mode'); updateActiveBtn(btn); checkAndLoadMore(); }
    async function setFilter(type, btn) {
      const featSec = document.getElementById('featured-section');
      if (type === 'images') { filteredMedia = allMedia.filter(m => !m.isVideo); if (featSec) featSec.style.display = 'none'; } 
      else if (type === 'videos') { filteredMedia = allMedia.filter(m => m.isVideo); if (featSec) featSec.style.display = 'block'; } 
      else { filteredMedia = allMedia; if (featSec) featSec.style.display = 'block'; }
      galleryEl.innerHTML = ''; currentBatchIndex = 0; updateActiveBtn(btn); await checkAndLoadMore();
    }
    function updateActiveBtn(btn) { Array.from(btn.parentElement.children).forEach(b => b.classList.remove('active')); btn.classList.add('active'); }

    const lightbox = document.getElementById('lightbox'), lbContainer = document.getElementById('lightbox-media-container');

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox || e.target === lbContainer) closeLightbox();
    });

    function openLightbox(index) { 
      if (index < 0 || index >= filteredMedia.length) return;
      currentLightboxIndex = index; 
      lightbox.classList.add('active'); 
      document.body.classList.add('no-scroll'); 
      renderLightboxContent(filteredMedia[currentLightboxIndex]); 
    }
    
    function renderLightboxContent(item) {
      lbContainer.innerHTML = ''; 
      const loader = document.getElementById('lightbox-loader'); 
      if (loader) loader.style.display = 'block';
      
      if (item.isVideo) { 
        lbContainer.innerHTML = buildCustomPlayer(item.url);
        initCustomPlayer(lbContainer);
        if (loader) loader.style.display = 'none';
      } else { 
        const elem = document.createElement('img'); 
        elem.onload = () => { if (loader) loader.style.display = 'none'; }; 
        elem.src = item.url; 
        elem.id = 'lightbox-content'; 
        lbContainer.appendChild(elem);
      }
    }

    function buildCustomPlayer(url) {
      return `
        <div class="modern-video-wrapper paused">
          <video src="${url}" preload="auto" autoplay playsinline></video>
          <div class="big-play-btn"><svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg></div>
          <div class="video-controls-overlay">
            <div class="vid-progress-bar"><div class="vid-progress-fill"></div></div>
            <div class="vid-controls-row">
              <div class="vid-ctrl-group">
                <button class="vid-btn play-pause-btn"><svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg></button>
                <span class="vid-time">0:00</span>
              </div>
              <div class="vid-ctrl-group">
                <button class="vid-btn mute-btn"><svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg></button>
                <button class="vid-btn fullscreen-btn"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg></button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function initCustomPlayer(containerWrapper) {
      const wrapper = containerWrapper.querySelector('.modern-video-wrapper');
      const video = wrapper.querySelector('video');
      const playBtn = wrapper.querySelector('.play-pause-btn');
      const bigPlayBtn = wrapper.querySelector('.big-play-btn');
      const progressContainer = wrapper.querySelector('.vid-progress-bar');
      const progressBar = wrapper.querySelector('.vid-progress-fill');
      const timeDisplay = wrapper.querySelector('.vid-time');
      const muteBtn = wrapper.querySelector('.mute-btn');
      const fsBtn = wrapper.querySelector('.fullscreen-btn');

      const formatTime = (time) => { const m = Math.floor(time / 60); const s = Math.floor(time % 60).toString().padStart(2, '0'); return `${m}:${s}`; };
      
      const togglePlay = (e) => {
        if(e) e.stopPropagation();
        if(video.paused) { video.play(); wrapper.classList.remove('paused'); playBtn.innerHTML = `<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`; }
        else { video.pause(); wrapper.classList.add('paused'); playBtn.innerHTML = `<svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`; }
      };

      video.addEventListener('click', togglePlay);
      playBtn.addEventListener('click', togglePlay);
      bigPlayBtn.addEventListener('click', togglePlay);
      
      video.addEventListener('timeupdate', () => { 
        if(video.duration) { 
          progressBar.style.width = `${(video.currentTime / video.duration) * 100}%`; 
          timeDisplay.textContent = formatTime(video.currentTime); 
        } 
      });
      
      progressContainer.addEventListener('click', (e) => { 
        e.stopPropagation();
        const rect = progressContainer.getBoundingClientRect(); 
        video.currentTime = ((e.clientX - rect.left) / rect.width) * video.duration; 
      });
      
      muteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        video.muted = !video.muted;
        if(video.muted) muteBtn.innerHTML = `<svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>`;
        else muteBtn.innerHTML = `<svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>`;
      });
      
      fsBtn.addEventListener('click', (e) => { 
        e.stopPropagation();
        if (wrapper.requestFullscreen) wrapper.requestFullscreen(); else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen(); 
      });

      let timeout;
      wrapper.addEventListener('mousemove', () => {
        wrapper.classList.add('show-controls');
        clearTimeout(timeout);
        timeout = setTimeout(() => { if(!video.paused) wrapper.classList.remove('show-controls'); }, 2500);
      });
      
      wrapper.addEventListener('click', (e) => e.stopPropagation()); // מונע סגירת לייטבוקס בלחיצה על הסרטון
    }

    function navigateLightbox(dir, e) {
      if(e) e.stopPropagation();
      if (currentLightboxIndex === -1) return;
      currentLightboxIndex += dir;
      if (currentLightboxIndex < 0) currentLightboxIndex = filteredMedia.length - 1;
      if (currentLightboxIndex >= filteredMedia.length) currentLightboxIndex = 0;
      renderLightboxContent(filteredMedia[currentLightboxIndex]);
    }

    function closeLightbox(e) { 
      if(e) e.stopPropagation();
      lightbox.classList.remove('active'); 
      document.body.classList.remove('no-scroll');
      currentLightboxIndex = -1; 
      const video = lbContainer.querySelector('video');
      if(video) video.pause();
      lbContainer.innerHTML = ''; 
    }
    
    document.addEventListener('keydown', (e) => {
      if (lightbox.classList.contains('active')) {
        if (e.key === 'ArrowLeft') navigateLightbox(1);
        else if (e.key === 'ArrowRight') navigateLightbox(-1);
        else if (e.key === 'Escape') closeLightbox();
      }
    });

    // תמיכה בהחלקת אצבע (Swipe) למובייל
    let touchStartX = 0;
    lightbox.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, {passive: true});
    lightbox.addEventListener('touchend', e => {
      if (!lightbox.classList.contains('active')) return;
      const touchEndX = e.changedTouches[0].screenX;
      const threshold = 50; 
      if (touchEndX < touchStartX - threshold) navigateLightbox(1); 
      if (touchEndX > touchStartX + threshold) navigateLightbox(-1); 
    }, {passive: true});

    window.onload = fetchFromGitHub;
  </script>
</body>
</html>
