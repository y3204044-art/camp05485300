<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>קעמפ ביה״ז אב פ״ה באופקים</title>
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700&family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a1128; /* כחול-ים עמוק */
      --bg-panel: rgba(10, 19, 43, 0.8);
      --border-glass: #fdb913; 
      --text-main: #ffffff;
      --radius-large: 20px;
      --radius-medium: 12px;
      --google-blue: #4285F4;
      --google-red: #EA4335;
      --google-yellow: #FBBC05;
      --google-green: #34A853;
    }

    body {
      margin: 0;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Heebo', sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      user-select: none;
      -webkit-user-drag: none;
      /* סמן עכבר מיוחד עם הילה */
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="10" fill="%2300ffcc" opacity="0.6"/><circle cx="16" cy="16" r="5" fill="%23ff00cc" /></svg>') 16 16, auto;
    }

    .bg-spotlights {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, #0c1a3b 0%, #050a14 100%);
    }
    
    .spotlight {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.4;
      animation: floatSpotlight 20s infinite alternate ease-in-out;
    }
    .spotlight:nth-child(1) { width: 50vw; height: 50vw; background: #00bb3f; top: -10%; left: -10%; animation-delay: 0s; }
    .spotlight:nth-child(2) { width: 60vw; height: 60vw; background: #0056a0; bottom: -20%; right: -10%; animation-delay: -5s; }
    .spotlight:nth-child(3) { width: 40vw; height: 40vw; background: #00ffcc; top: 40%; left: 30%; animation-delay: -10s; }

    @keyframes floatSpotlight {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(15vw, 15vh) scale(1.2); }
    }

    header {
      position: sticky;
      top: 0;
      width: 100%;
      padding: 15px 0;
      background: rgba(10, 17, 40, 0.9);
      backdrop-filter: blur(20px);
      border-bottom: 2px solid var(--google-yellow);
      z-index: 100;
      text-align: center;
      transition: transform 0.4s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    header.hidden { transform: translateY(-100%); }

    .logo-container { margin-bottom: 10px; }
    .logo-img {
      max-height: 70px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(253, 185, 19, 0.4);
      border: 2px solid #fff;
    }

    /* כותרת בצבעי גוגל מדויקים */
    h1 {
      font-family: 'Heebo', sans-serif;
      font-weight: 900;
      font-size: 3rem;
      margin: 0;
      background: linear-gradient(90deg, var(--google-blue), var(--google-red), var(--google-yellow), var(--google-blue), var(--google-green), var(--google-red));
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shineTitle 4s linear infinite;
      text-shadow: 
        -1px -1px 0 rgba(255,255,255,0.9),
        1px -1px 0 rgba(255,255,255,0.9),
        -1px 1px 0 rgba(255,255,255,0.9),
        1px 1px 0 rgba(255,255,255,0.9),
        0 6px 12px rgba(0,0,0,0.7);
    }
    @keyframes shineTitle { to { background-position: 200% center; } }

    /* תת כותרת מוקטנת מאוד ומעודנת */
    .subtitle {
      font-size: 0.75rem; /* הוקטן משמעותית */
      font-weight: bold;
      color: #fff;
      margin-top: 8px;
      letter-spacing: 0.5px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
      background: var(--google-red);
      display: inline-block;
      padding: 3px 12px;
      border-radius: 15px;
      border: 1px solid var(--google-yellow);
    }

    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
      padding: 0 15px;
    }

    .btn-group {
      display: flex;
      background: rgba(0,0,0,0.5);
      border-radius: var(--radius-large);
      padding: 4px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .btn {
      background: transparent;
      color: #ccc;
      border: none;
      padding: 6px 14px;
      border-radius: var(--radius-large);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.1s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
    
    .btn.active {
      background: var(--google-blue);
      color: #fff;
      box-shadow: 0 0 10px var(--google-blue);
    }

    .gallery-container {
      display: grid;
      padding: 20px;
      max-width: 1800px;
      margin: 0 auto;
      transition: all 0.3s ease;
    }

    .gallery-container[data-size="small"] { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
    .gallery-container[data-size="medium"] { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
    .gallery-container[data-size="large"] { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }

    .gallery-container.masonry-mode { display: block; column-gap: 10px; }
    .gallery-container.masonry-mode[data-size="small"] { columns: 7 100px; }
    .gallery-container.masonry-mode[data-size="medium"] { columns: 5 180px; }
    .gallery-container.masonry-mode[data-size="large"] { columns: 3 300px; }

    .gallery-container.masonry-mode .media-card { 
      margin-bottom: 10px; 
      break-inside: avoid; /* פקודת ברזל נגד קפיצות */
      page-break-inside: avoid;
      -webkit-column-break-inside: avoid;
      display: inline-block;
      width: 100%;
    }

    .media-card {
      position: relative;
      background: var(--bg-panel);
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #1a2c5b;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      opacity: 0;
      animation: popIn 0.4s ease-out forwards;
      transition: transform 0.15s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.15s, border-color 0.15s;
      transform-origin: center center;
      z-index: 1;
      cursor: pointer;
      will-change: transform;
      backface-visibility: hidden;
    }

    /* הזום הקטן והיציב בריחוף עכבר */
    .media-card:hover {
      transform: scale(1.02) translateY(-2px) !important; /* זום עדין מאוד! */
      border-color: var(--google-yellow);
      box-shadow: 0 15px 25px rgba(0,0,0,0.8), 0 0 15px rgba(253, 185, 19, 0.4);
      z-index: 100 !important;
    }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(15px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .media-item {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }
    
    /* תיקון עבור מצב גריד רגיל כדי שלא ימרחו */
    .gallery-container:not(.masonry-mode) .media-item {
      aspect-ratio: 1 / 1; /* ריבוע חתוך */
    }
    .gallery-container.masonry-mode .media-item {
      aspect-ratio: auto; /* תמונה מלאה בתפזורת */
    }

    /* אייקון וידאו */
    .video-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.5rem;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 0 15px #00ffcc, 0 0 10px #000;
      pointer-events: none;
      z-index: 6;
      transition: opacity 0.2s;
    }
    .media-card:hover .video-icon { opacity: 0; }

    .glass-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 5;
    }

    /* טקסט טעינה מהבהב ויפה */
    .loading-indicator {
      text-align: center;
      font-size: 1.4rem;
      font-weight: bold;
      padding: 40px;
      width: 100%;
      display: none; /* מוסתר כברירת מחדל */
      animation: blinkText 1s infinite alternate;
    }
    .loading-indicator.visible {
      display: block;
    }
    @keyframes blinkText {
      0% { opacity: 0.4; color: var(--google-blue); text-shadow: 0 0 10px var(--google-blue); }
      50% { opacity: 1; color: var(--google-red); text-shadow: 0 0 20px var(--google-red); }
      100% { opacity: 0.4; color: var(--google-yellow); text-shadow: 0 0 10px var(--google-yellow); }
    }

    #lightbox {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 5, 8, 0.95);
      backdrop-filter: blur(15px);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #lightbox.active { opacity: 1; pointer-events: auto; }
    #lightbox-content {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: var(--radius-large);
      box-shadow: 0 0 40px rgba(0, 255, 200, 0.3);
      border: 2px solid rgba(255,255,255,0.1);
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    #lightbox.active #lightbox-content { transform: scale(1); }
    
    .close-btn {
      position: absolute;
      top: 20px; right: 20px;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      z-index: 10000;
      background: rgba(255,255,255,0.1);
      border-radius: 50%;
      width: 50px; height: 50px;
      display: flex; justify-content: center; align-items: center;
      transition: all 0.2s;
    }
    .close-btn:hover { background: var(--google-red); transform: scale(1.1); }
  </style>
</head>
<body>

  <div class="bg-spotlights">
    <div class="spotlight"></div><div class="spotlight"></div><div class="spotlight"></div>
  </div>

  <header id="main-header">
    <div class="logo-container">
      <img src="logo.jpg" class="logo-img" alt="לוגו" onerror="this.style.display='none'">
    </div>
    <h1>קעמפ ביה״ז אב פ״ה באופקים</h1>
    <div class="subtitle">בנשיאות הגרא״ד האוסמן הי״ו</div>
    
    <div class="controls-bar">
      <div class="btn-group">
        <button class="btn active" onclick="setFilter('all', this)">הכל</button>
        <button class="btn" onclick="setFilter('images', this)">תמונות</button>
        <button class="btn" onclick="setFilter('videos', this)">סרטונים</button>
      </div>
      <div class="btn-group">
        <button class="btn active" onclick="setSize('small', this)">קטן</button>
        <button class="btn" onclick="setSize('medium', this)">בינוני</button>
        <button class="btn" onclick="setSize('large', this)">גדול</button>
      </div>
      <div class="btn-group">
        <button class="btn" onclick="setLayout('grid', this)">ריבועים קבועים</button>
        <button class="btn active" onclick="setLayout('masonry', this)">תפזורת מלאה</button>
      </div>
    </div>
  </header>

  <main id="gallery" class="gallery-container masonry-mode" data-size="small"></main>
  
  <div id="loading-indicator" class="loading-indicator">
    המערכת טוענת עוד תמונות וחומר...
  </div>

  <div id="lightbox">
    <div class="close-btn" onclick="closeLightbox()">✖</div>
    <div id="lightbox-media-container" style="position: relative;">
        <div class="glass-overlay" style="z-index: 10;"></div>
    </div>
  </div>

  <script>
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && ['s','u','i','p'].includes(e.key.toLowerCase())) e.preventDefault();
      if (e.key === 'F12') e.preventDefault();
    });

    let lastScroll = 0;
    const header = document.getElementById('main-header');
    window.addEventListener('scroll', () => {
      const currentScroll = window.scrollY;
      if (currentScroll > 50) header.classList.add('hidden');
      else header.classList.remove('hidden');
      lastScroll = currentScroll;
    });

    let allMedia = [];
    let filteredMedia = [];
    let currentBatchIndex = 0;
    const BATCH_SIZE = 12; // הוקטן ל-12 פריטים כדי להבטיח טעינה יציבה ובטוחה
    const galleryEl = document.getElementById('gallery');
    const loadingIndicator = document.getElementById('loading-indicator');
    
    // דגל שמונע התנגשויות וקפיצות בטעינה (Semaphore)
    let isRendering = false; 

    async function fetchFromGitHub() {
      loadingIndicator.classList.add('visible');
      try {
        const repoUrl = 'https://api.github.com/repos/y3204044-art/camp05485300-gmail.com/git/trees/main?recursive=1';
        const res = await fetch(repoUrl);
        const data = await res.json();
        
        if (!data.tree) throw new Error("No files found");

        allMedia = data.tree
          .filter(f => f.type === 'blob' && f.path.match(/\.(jpg|jpeg|png|gif|webp|mp4|webm|mov)$/i))
          .map(f => {
            const rawUrl = `https://cdn.jsdelivr.net/gh/y3204044-art/camp05485300-gmail.com@main/${f.path}`;
            const isVideo = !!f.path.match(/\.(mp4|webm|mov)$/i);
            return {
              url: rawUrl,
              isVideo: isVideo,
              // הורדת איכות דרסטית לתצוגה המקדימה לטובת מהירות ויציבות (w=200, q=40)
              thumb: isVideo ? rawUrl : `https://images.weserv.nl/?url=${encodeURIComponent(rawUrl)}&w=200&q=40`
            };
          });

        allMedia.sort(() => Math.random() - 0.5);
        filteredMedia = [...allMedia];
        
        galleryEl.innerHTML = "";
        currentBatchIndex = 0;
        await renderBatch(); // מתחיל לטעון

      } catch (err) {
        loadingIndicator.innerText = "שגיאה בסריקה. ודא שהקוד תקין.";
      }
    }

    async function renderBatch() {
      if (isRendering) return; // מונע כפילויות בפקודות
      isRendering = true;
      loadingIndicator.classList.add('visible');

      const fragment = document.createDocumentFragment();
      const end = Math.min(currentBatchIndex + BATCH_SIZE, filteredMedia.length);
      
      // מערך לשמירת הבטחות (Promises) של טעינת התמונות מראש
      const loadPromises = [];
      
      for (let i = currentBatchIndex; i < end; i++) {
        const item = filteredMedia[i];
        const card = document.createElement('div');
        card.className = 'media-card';
        card.onclick = () => openLightbox(item);
        
        const overlay = document.createElement('div');
        overlay.className = 'glass-overlay';

        if (item.isVideo) {
          const video = document.createElement('video');
          video.src = item.thumb;
          video.className = 'media-item';
          video.muted = true;
          video.loop = true;
          
          let playPromise;
          card.onmouseenter = () => { playPromise = video.play().catch(()=>{}); };
          card.onmouseleave = () => {
             if (playPromise !== undefined) {
               playPromise.then(() => { video.pause(); }).catch(()=>{});
             }
          };
          card.appendChild(video);
          
          const icon = document.createElement('div');
          icon.className = 'video-icon';
          icon.innerHTML = '▶';
          card.appendChild(icon);
          
          // סרטונים מדלגים על הטעינה מראש כדי לא לעכב את שאר התמונות
          loadPromises.push(Promise.resolve()); 
        } else {
          const img = document.createElement('img');
          img.className = 'media-item';
          
          // פה הקסם: מורידים את התמונה בזיכרון לפני שזורקים אותה למסך
          const imgPromise = new Promise(resolve => {
             img.onload = resolve; // כשהתמונה סיימה לרדת, סמן כ"מוכן"
             img.onerror = resolve; // גם אם יש שגיאה בתמונה ספציפית, תמשיך הלאה
             img.src = item.thumb;
          });
          loadPromises.push(imgPromise);
          card.appendChild(img);
        }
        
        card.appendChild(overlay);
        fragment.appendChild(card);
      }
      
      // עוצרים את התהליך ומחכים שכל 12 התמונות בנגלה הזו יסיימו לרדת במלואן
      await Promise.all(loadPromises);
      
      // רק אחרי שכולן מוכנות, שופכים אותן בבת אחת למסך (אפס קפיצות!)
      galleryEl.appendChild(fragment);
      currentBatchIndex = end;
      
      loadingIndicator.classList.remove('visible');
      
      // נותנים לדפדפן חצי שנייה לנוח ולסדר את המסך לפני שהוא מאפשר לטעון עוד קבוצה
      setTimeout(() => {
          isRendering = false;
      }, 500);
    }

    // גלילה חכמה - טוען רק אם לא טוענים כבר משהו אחר
    window.addEventListener('scroll', () => {
      if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
        if (currentBatchIndex < filteredMedia.length) {
            renderBatch();
        }
      }
    });

    function setSize(size, btn) {
      document.querySelector('.gallery-container').setAttribute('data-size', size);
      updateActiveBtn(btn);
    }

    function setLayout(layout, btn) {
      const gal = document.querySelector('.gallery-container');
      if(layout === 'masonry') gal.classList.add('masonry-mode');
      else gal.classList.remove('masonry-mode');
      updateActiveBtn(btn);
    }

    async function setFilter(type, btn) {
      if(type === 'all') filteredMedia = allMedia;
      else if(type === 'images') filteredMedia = allMedia.filter(m => !m.isVideo);
      else if(type === 'videos') filteredMedia = allMedia.filter(m => m.isVideo);
      
      galleryEl.innerHTML = "";
      currentBatchIndex = 0;
      updateActiveBtn(btn);
      await renderBatch();
    }

    function updateActiveBtn(btn) {
      Array.from(btn.parentElement.children).forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    const lightbox = document.getElementById('lightbox');
    const lbContainer = document.getElementById('lightbox-media-container');

    function openLightbox(item) {
      Array.from(lbContainer.children).forEach(c => {
         if(!c.classList.contains('glass-overlay')) c.remove();
      });

      let elem;
      if (item.isVideo) {
        elem = document.createElement('video');
        elem.src = item.url;
        elem.controls = true;
        elem.autoplay = true;
        elem.id = "lightbox-content";
      } else {
        elem = document.createElement('img');
        elem.src = item.url; 
        elem.id = "lightbox-content";
      }
      
      lbContainer.insertBefore(elem, lbContainer.firstChild);
      lightbox.classList.add('active');
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      setTimeout(() => {
        const content = document.getElementById('lightbox-content');
        if (content) {
            if(content.tagName === 'VIDEO') content.pause();
            content.remove();
        }
      }, 300);
    }

    window.onload = fetchFromGitHub;
  </script>
</body>
</html>
