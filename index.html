<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הגלריה שלי</title>
  <style>
    body {
      margin: 0;
      background-color: #121212;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    header {
      padding: 1rem;
      text-align: center;
      background-color: #1e1e1e;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 15px;
      padding: 20px;
    }
    .media-item {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 8px;
      background: #2a2a2a;
    }
    video.media-item {
      background: #000;
    }
  </style>
</head>
<body>
  <header>
    <h1>גלריית מדיה</h1>
  </header>
  <div class="gallery" id="gallery"></div>
  <script src="script.js"></script>
</body>
</html>
