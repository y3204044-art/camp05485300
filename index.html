<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>קעמפ ביה״ז אב פ״ה באופקים</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;500;700;900&display=swap" rel="stylesheet">
  <style>
    /* הגדרות בסיס - עיצוב מודרני, צבעוני ורך */
    :root {
      --bg-color: #f0f2f5;
      --card-radius: 24px;
      --glass-bg: rgba(255, 255, 255, 0.7);
      --glass-border: rgba(255, 255, 255, 0.5);
      --shadow-soft: 0 8px 30px rgba(0, 0, 0, 0.08);
      --primary-gradient: linear-gradient(135deg, #FF6A00, #EE0979, #9c27b0);
    }

    body {
      margin: 0;
      background-color: var(--bg-color);
      /* רקע צבעוני עדין ומודרני */
      background-image: 
        radial-gradient(at 0% 0%, hsla(253,16%,7%,0.05) 0, transparent 50%), 
        radial-gradient(at 50% 0%, hsla(225,39%,30%,0.05) 0, transparent 50%), 
        radial-gradient(at 100% 0%, hsla(339,49%,30%,0.05) 0, transparent 50%);
      font-family: 'Heebo', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* חסימת גרירה ולחיצות מיותרות על מדיה */
    img, video {
      pointer-events: none;
      -webkit-user-drag: none;
    }

    /* --- סרגל עליון (Header) --- */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      box-shadow: var(--shadow-soft);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s;
    }

    header.scrolled {
      transform: translateY(-100%);
      opacity: 0;
    }

    h1 {
      margin: 0;
      font-size: 2.8rem;
      font-weight: 900;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      letter-spacing: -1px;
    }

    /* כפתורי סינון */
    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .filter-btn {
      background: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 30px;
      font-family: 'Heebo', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      color: #333;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      transition: all 0.3s ease;
    }

    .filter-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }

    .filter-btn.active {
      background: var(--primary-gradient);
      color: white;
      box-shadow: 0 8px 20px rgba(238, 9, 121, 0.3);
    }

    /* --- תצוגת הגלריה (Masonry Layout) --- */
    .gallery-container {
      padding: 30px 20px;
      max-width: 1800px;
      margin: 0 auto;
      /* הגדרת כמות עמודות לפי גודל מסך - תצוגה צפופה ויפה */
      column-count: 5;
      column-gap: 20px;
    }

    @media (max-width: 1400px) { .gallery-container { column-count: 4; } }
    @media (max-width: 1000px) { .gallery-container { column-count: 3; } }
    @media (max-width: 700px)  { .gallery-container { column-count: 2; } }
    @media (max-width: 450px)  { .gallery-container { column-count: 1; } }

    .media-card {
      break-inside: avoid;
      margin-bottom: 20px;
      position: relative;
      border-radius: var(--card-radius);
      overflow: hidden;
      background: #fff;
      box-shadow: var(--shadow-soft);
      cursor: pointer;
      transform: scale(0.95);
      opacity: 0;
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    @keyframes popIn {
      to { transform: scale(1); opacity: 1; }
    }

    .media-card:hover {
      transform: scale(1.03) translateY(-5px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      z-index: 10;
    }

    .media-item {
      width: 100%;
      display: block;
      border-radius: var(--card-radius);
      object-fit: cover;
    }

    .video-badge {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      backdrop-filter: blur(4px);
      z-index: 2;
    }

    /* שכבת הגנה בלחיצה */
    .protection-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 5;
    }

    /* --- מסך מלא (Modal Lightbox) --- */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .modal.active {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      position: relative;
      max-width: 95vw;
      max-height: 90vh;
      border-radius: var(--card-radius);
      box-shadow: 0 0 60px rgba(0,0,0,0.8);
      transform: scale(0.8);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal.active .modal-content {
      transform: scale(1);
    }

    .modal-content img, .modal-content video {
      max-width: 100%;
      max-height: 90vh;
      display: block;
      border-radius: var(--card-radius);
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 30px;
      color: white;
      font-size: 2.5rem;
      cursor: pointer;
      z-index: 10000;
      background: rgba(0,0,0,0.3);
      width: 50px; height: 50px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(5px);
      transition: background 0.3s;
    }

    .close-btn:hover {
      background: rgba(255,255,255,0.2);
    }

    /* כפתור פליי מותאם אישית למסך מלא */
    .custom-play-btn {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--primary-gradient);
      border: none;
      color: white;
      padding: 15px 40px;
      border-radius: 30px;
      font-size: 1.2rem;
      font-family: 'Heebo', sans-serif;
      font-weight: bold;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(238, 9, 121, 0.4);
    }

    .status-msg {
      text-align: center;
      grid-column: 1 / -1;
      font-size: 1.5rem;
      color: #666;
      margin-top: 100px;
    }
    
    .spinner {
      width: 50px; height: 50px;
      border: 5px solid rgba(238, 9, 121, 0.2);
      border-top-color: #EE0979;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

  </style>
</head>
<body>

  <header id="header">
    <h1>קעמפ ביה״ז אב פ״ה באופקים</h1>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">הכל</button>
      <button class="filter-btn" data-filter="image">תמונות מחזור</button>
      <button class="filter-btn" data-filter="video">סרטונים ורגעים</button>
    </div>
  </header>

  <div id="status" class="status-msg">
    <div class="spinner"></div>
    טוען זכרונות מכל רחבי המאגר...
  </div>

  <div class="gallery-container" id="gallery"></div>

  <!-- מסך מלא למדיה -->
  <div class="modal" id="modal">
    <div class="close-btn" id="close-modal">&times;</div>
    <div class="modal-content" id="modal-body">
      <!-- התוכן יוזרק לכאן -->
    </div>
  </div>

  <script>
    // --- הגנות הרמטיות נגד העתקה ---
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.metaKey) {
        const key = e.key.toLowerCase();
        if (key === 's' || key === 'u' || key === 'p' || key === 'c') e.preventDefault();
      }
      if (e.key === 'F12') e.preventDefault();
    });

    // --- העלמת סרגל בגלילה ---
    let lastScroll = 0;
    const header = document.getElementById('header');
    window.addEventListener('scroll', () => {
      const currentScroll = window.scrollY;
      if (currentScroll > 100 && currentScroll > lastScroll) {
        header.classList.add('scrolled'); // גולל למטה - הסתר
      } else {
        header.classList.remove('scrolled'); // גולל למעלה - הצג
      }
      lastScroll = currentScroll;
    });

    // --- סריקה חכמה של כל הגיטהאב ---
    const REPO_OWNER = "y3204044-art";
    const REPO_NAME = "camp05485300-gmail.com";
    const BRANCH = "main"; // ברירת מחדל
    // API שסורק את *כל* התיקיות בעץ של הפרויקט במכה אחת
    const API_URL = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/trees/${BRANCH}?recursive=1`;
    
    const gallery = document.getElementById('gallery');
    const statusDiv = document.getElementById('status');
    const filterBtns = document.querySelectorAll('.filter-btn');
    
    let allFiles = []; // ישמור את כל המדיה

    async function fetchAllMedia() {
      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error("לא הצלחתי לסרוק את המאגר");
        const data = await response.json();
        
        // סינון רק של קבצי מדיה מתוך כל העץ
        data.tree.forEach(item => {
          if (item.type === "blob") {
            const ext = item.path.split('.').pop().toLowerCase();
            const isVideo = ['mp4', 'mov', 'webm', 'mkv'].includes(ext);
            const isImage = ['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext);
            
            if (isVideo || isImage) {
              // יצירת קישור ישיר (Raw) לקובץ
              const rawUrl = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${item.path}`;
              allFiles.push({ url: rawUrl, isVideo: isVideo });
            }
          }
        });

        if (allFiles.length === 0) {
          statusDiv.innerHTML = "לא נמצאו תמונות או סרטונים באף תיקייה.";
          return;
        }

        // ערבוב אקראי לתצוגה יפה
        allFiles.sort(() => Math.random() - 0.5);
        statusDiv.style.display = 'none';
        
        renderGallery('all');

      } catch (error) {
        statusDiv.innerHTML = "שגיאה בטעינת המדיה מ-GitHub.";
        console.error(error);
      }
    }

    function renderGallery(filterType) {
      gallery.innerHTML = ''; // ניקוי
      
      let delay = 0; // לאנימציית כניסה מדורגת

      allFiles.forEach(file => {
        if (filterType === 'image' && file.isVideo) return;
        if (filterType === 'video' && !file.isVideo) return;

        const card = document.createElement('div');
        card.className = 'media-card';
        card.style.animationDelay = `${delay}s`;
        delay += 0.05;

        const overlay = document.createElement('div');
        overlay.className = 'protection-overlay';
        // פתיחה במסך מלא בלחיצה
        overlay.addEventListener('click', () => openModal(file));

        if (file.isVideo) {
          card.innerHTML = `<div class="video-badge">▶ וידאו</div><video src="${file.url}" class="media-item" muted loop playsinline></video>`;
          const video = card.querySelector('video');
          
          // ניגון מקדים כשהעכבר עובר
          card.addEventListener('mouseenter', () => video.play().catch(()=>{}));
          card.addEventListener('mouseleave', () => {
             // השהיה זהירה
             if(!video.paused) video.pause();
          });
        } else {
          card.innerHTML = `<img src="${file.url}" class="media-item" loading="lazy">`;
        }

        card.appendChild(overlay);
        gallery.appendChild(card);
      });
    }

    // --- לוגיקת מסך מלא (Modal) ---
    const modal = document.getElementById('modal');
    const modalBody = document.getElementById('modal-body');
    const closeBtn = document.getElementById('close-modal');
    let currentVideoInModal = null;

    function openModal(file) {
      modalBody.innerHTML = ''; // ניקוי
      
      const internalOverlay = document.createElement('div');
      internalOverlay.className = 'protection-overlay';

      if (file.isVideo) {
        currentVideoInModal = document.createElement('video');
        currentVideoInModal.src = file.url;
        currentVideoInModal.playsinline = true;
        currentVideoInModal.controlsList = "nodownload noplaybackrate"; // חוסם הורדה

        const playBtn = document.createElement('button');
        playBtn.className = 'custom-play-btn';
        playBtn.innerText = 'הפעל וידאו ▶';
        
        let isPlaying = false;
        playBtn.onclick = (e) => {
          e.stopPropagation();
          if (isPlaying) {
            currentVideoInModal.pause();
            playBtn.innerText = 'הפעל וידאו ▶';
          } else {
            currentVideoInModal.play();
            playBtn.innerText = 'השהה ⏸';
          }
          isPlaying = !isPlaying;
        };

        modalBody.appendChild(currentVideoInModal);
        modalBody.appendChild(playBtn);
        // השכבה מונעת לחיצה ימנית על הוידאו
        modalBody.appendChild(internalOverlay);

      } else {
        const img = document.createElement('img');
        img.src = file.url;
        modalBody.appendChild(img);
        modalBody.appendChild(internalOverlay);
      }

      modal.classList.add('active');
    }

    function closeModal() {
      modal.classList.remove('active');
      if (currentVideoInModal) {
        currentVideoInModal.pause();
        currentVideoInModal = null;
      }
      setTimeout(() => modalBody.innerHTML = '', 400); // ניקוי אחרי האנימציה
    }

    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal(); // סגירה בלחיצה על הרקע
    });

    // --- הפעלת כפתורי הסינון ---
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGallery(btn.dataset.filter);
      });
    });

    // התנעה
    fetchAllMedia();
  </script>
</body>
</html>
