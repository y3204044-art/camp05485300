<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>קעמפ ביה״ז אב פ״ה באופקים</title>
  
  <link rel="preconnect" href="https://wsrv.nl">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://drive.google.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;800;900&family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/y3204044-art/camp05485300-gmail.com/main/logo.JPG">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/plyr/3.7.8/plyr.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/plyr/3.7.8/plyr.min.js"></script>
  
  <style>
    :root {
      --bg-dark: #070d1e;
      --bg-panel: rgba(12, 22, 50, 0.85);
      --radius-large: 20px;
      --radius-medium: 12px;
      --google-blue: #4285f4;
      --google-red: #ea4335;
      --google-yellow: #fbbc05;
      --google-green: #34a853;
      --neon-pink: #ff007f;
      --neon-cyan: #00f0ff;
    }

    * { 
      box-sizing: border-box; 
      /* סמן העכבר הוסר כבקשתך ומוגדר כברירת מחדל */
    }

    body {
      margin: 0; background-color: var(--bg-dark); color: #fff;
      font-family: 'Heebo', sans-serif; overflow-x: hidden; min-height: 100vh;
      user-select: none; -webkit-user-drag: none;
    }
    
    body.locked, body.no-scroll { overflow: hidden; }

    #scroll-progress {
      position: fixed;
      top: 0; left: 0;
      height: 4px;
      background: linear-gradient(to right, var(--neon-pink), var(--neon-cyan));
      width: 0%;
      z-index: 1000001;
      box-shadow: 0 0 10px var(--neon-cyan);
      transition: width 0.1s ease-out;
    }

    #back-to-top {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 50px; height: 50px;
      background: rgba(12, 22, 50, 0.8);
      border: 2px solid var(--neon-cyan);
      border-radius: 50%;
      color: #fff;
      display: flex; justify-content: center; align-items: center;
      cursor: pointer;
      opacity: 0; pointer-events: none;
      transform: translateY(20px);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      z-index: 9998;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }
    
    #back-to-top.visible {
      opacity: 1; pointer-events: auto; transform: translateY(0);
    }
    
    #back-to-top:hover {
      background: var(--neon-cyan);
      color: #000;
      box-shadow: 0 0 25px var(--neon-cyan);
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      transform: scale(0);
      animation: rippleEffect 0.6s linear;
      background-color: rgba(255, 255, 255, 0.4);
      pointer-events: none;
      z-index: 99999;
    }
    @keyframes rippleEffect {
      to { transform: scale(4); opacity: 0; }
    }

    #fireworks-layer {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 9999; overflow: hidden;
    }
    
    .firework {
      position: absolute;
      width: 3px; height: 3px;
      border-radius: 50%;
      animation: fwExplode 1.2s ease-out forwards;
    }
    
    @keyframes fwExplode { 
      0% { transform: scale(0.1); opacity: 1; } 
      50% { opacity: 1; }
      100% { transform: scale(1.5) translateY(20px); opacity: 0; }
    }

    #login-gate {
      position: fixed; inset: 0; z-index: 9999999;
      background: radial-gradient(circle at center, #0c1c42 0%, #02050d 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: all 1s cubic-bezier(0.25, 1, 0.25, 1);
    }
    
    #login-gate::before, #login-gate::after {
      content: ''; position: absolute; width: 40vw; height: 40vw; border-radius: 50%;
      filter: blur(100px); z-index: -1; animation: floatBlobs 10s infinite alternate ease-in-out;
    }
    #login-gate::before { background: rgba(0, 240, 255, 0.15); top: -10%; left: -10%; }
    #login-gate::after { background: rgba(255, 0, 127, 0.15); bottom: -10%; right: -10%; animation-delay: -5s; }

    @keyframes floatBlobs { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(50px, 50px) scale(1.2); } }

    #login-gate.unlocked { transform: scale(1.5); opacity: 0; pointer-events: none; filter: blur(15px); }

    .login-box {
      background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      padding: 40px 35px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.05);
      text-align: center; display: flex; flex-direction: column; align-items: center;
      animation: floatBox 4s infinite alternate ease-in-out;
      width: 90%; max-width: 400px;
    }
    @keyframes floatBox { 0% { transform: translateY(0); } 100% { transform: translateY(-10px); } }

    .login-logo {
      width: 130px; height: 130px; border-radius: 50%; margin-bottom: 25px; object-fit: cover;
      box-shadow: 0 0 40px var(--neon-cyan), 0 0 20px var(--neon-pink);
      animation: superGlow 3s infinite alternate ease-in-out; padding: 4px;
      background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink));
    }
    @keyframes superGlow {
      0% { box-shadow: 0 0 30px var(--neon-cyan), 0 0 15px var(--neon-pink); transform: scale(1); }
      100% { box-shadow: 0 0 50px var(--neon-cyan), 0 0 30px var(--google-yellow); transform: scale(1.05); }
    }

    #system-boot-ui {
      width: 100%; background: #0a0a0a; border-radius: 8px; border: 1px solid #333;
      overflow: hidden; text-align: left; direction: ltr; font-family: monospace;
      margin-bottom: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    
    .mac-buttons { padding: 8px 12px; background: #1a1a1a; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid #333; }
    .mac-btn { width: 12px; height: 12px; border-radius: 50%; }
    .mac-close { background: #ff5f56; }
    .mac-min { background: #ffbd2e; }
    .mac-max { background: #27c93f; }
    .mac-title { color: #888; font-size: 0.75rem; flex: 1; text-align: center; margin-right: 48px; letter-spacing: 1px;}
    
    #console-history { padding: 12px; height: 130px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
    .console-line { font-size: 0.8rem; margin-bottom: 5px; color: #00ff00; word-break: break-all; }
    .console-line.warning { color: #ffeb3b; }
    .console-line.success { color: #00e5ff; }
    
    #progress-wrapper { padding: 0 12px 15px; }
    .progress-track { width: 100%; height: 6px; background: #222; border-radius: 3px; overflow: hidden; position: relative;}
    #progress-fill { height: 100%; background: #00e5ff; width: 0%; box-shadow: 0 0 10px #00e5ff; transition: width 0.1s linear; }
    #loading-percentage { text-align: center; color: #00e5ff; font-weight: bold; font-size: 1rem; margin-top: 10px; text-shadow: 0 0 8px #00e5ff; }

    #login-form-container { display: none; flex-direction: column; align-items: center; width: 100%; opacity: 0; }
    
    @keyframes glowingFadeIn { 
      0% { opacity: 0; transform: scale(0.9) translateY(30px); filter: brightness(2) blur(10px); } 
      100% { opacity: 1; transform: scale(1) translateY(0); filter: brightness(1) blur(0); } 
    }

    .gate-title {
      font-family: 'Fredoka', sans-serif; font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 900;
      color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.5); margin: 0 0 25px 0; letter-spacing: 1px;
    }

    .input-wrapper { position: relative; width: 100%; max-width: 260px; margin-bottom: 25px; }
    .input-wrapper svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; fill: rgba(255,255,255,0.5); transition: 0.3s; }
    
    .gate-input {
      width: 100%; padding: 15px 20px 15px 50px; font-size: 1.5rem; text-align: center;
      border: 2px solid rgba(255,255,255,0.1); border-radius: 30px; background: rgba(0,0,0,0.3);
      color: #fff; outline: none; transition: all 0.3s; direction: ltr; letter-spacing: 5px;
    }
    .gate-input:focus { border-color: var(--neon-cyan); background: rgba(0,0,0,0.5); box-shadow: 0 0 20px rgba(0,240,255,0.2); }
    .gate-input:focus + svg { fill: var(--neon-cyan); }

    .gate-btn {
      padding: 14px 40px; font-size: 1.2rem; font-family: 'Fredoka', sans-serif; font-weight: 800;
      color: #fff; background: linear-gradient(135deg, var(--google-blue), var(--neon-cyan));
      border: none; border-radius: 30px; cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 240, 255, 0.3); transition: all 0.3s; width: 100%; max-width: 260px;
    }
    .gate-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(0, 240, 255, 0.5); }

    .wait-note { font-size: 0.75rem; color: rgba(255,255,255,0.6); margin-top: 15px; animation: pulseText 2s infinite; }
    @keyframes pulseText { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px) rotate(-1deg); border-color: var(--google-red); }
      50% { transform: translateX(10px) rotate(1deg); }
      75% { transform: translateX(-10px) rotate(-1deg); }
    }

    #main-app {
      opacity: 0; transform: scale(0.95); filter: blur(10px);
      transition: all 1s cubic-bezier(0.25, 1, 0.25, 1); transition-delay: 0.1s;
    }
    body.unlocked #main-app { opacity: 1; transform: scale(1); filter: blur(0); pointer-events: auto; }

    .bg-spotlights {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2;
      overflow: hidden; pointer-events: none;
      background: linear-gradient(rgba(7, 13, 30, 0.4), rgba(4, 8, 20, 0.6)), url('https://raw.githubusercontent.com/y3204044-art/camp05485300/main/4.gif') center/cover no-repeat;
    }
    
    #particles-js {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none;
    }

    .light-beam {
      position: absolute; top: -200px; width: 350px; height: 1200px;
      background: linear-gradient(180deg, rgba(0, 240, 255, 0.25) 0%, rgba(255, 0, 127, 0.15) 50%, transparent 100%);
      filter: blur(50px); transform-origin: top center; animation: beamSweep 16s infinite alternate ease-in-out;
    }
    .light-beam:nth-child(1) { left: 10%; animation-delay: 0s; }
    .light-beam:nth-child(2) { left: 45%; background: linear-gradient(180deg, rgba(251, 188, 5, 0.25) 0%, rgba(52, 168, 83, 0.15) 50%, transparent 100%); animation-delay: -5s; }
    .light-beam:nth-child(3) { left: 75%; animation-delay: -10s; }
    @keyframes beamSweep { 0% { transform: rotate(-25deg) scaleX(1); opacity: 0.4; } 50% { transform: rotate(0deg) scaleX(1.3); opacity: 0.8; } 100% { transform: rotate(25deg) scaleX(1); opacity: 0.4; } }

    header {
      position: sticky; top: 0; width: 100%; padding: 12px 15px 10px;
      background: rgba(7, 13, 30, 0.94); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border-bottom: 2px solid var(--google-yellow); z-index: 100; text-align: center; transition: transform 0.4s ease;
      box-shadow: 0 10px 35px rgba(0,0,0,0.8);
    }
    header.hidden { transform: translateY(-100%); }

    .header-top-row { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 6px; position: relative; }

    .header-logo {
      width: 80px; height: 80px; border-radius: 50%; object-fit: cover;
      box-shadow: 0 0 25px var(--neon-cyan), 0 0 15px var(--neon-pink);
      animation: logoGlow 3s infinite alternate ease-in-out; position: relative; z-index: 2;
    }
    @media(min-width: 768px) { .header-logo { width: 100px; height: 100px; } }
    @keyframes logoGlow { 0% { transform: scale(1) rotate(0deg); box-shadow: 0 0 20px var(--neon-cyan); } 100% { transform: scale(1.06) rotate(3deg); box-shadow: 0 0 35px var(--google-yellow), 0 0 20px var(--neon-cyan); } }

    .title-wrapper { 
      display: inline !important; 
      background: linear-gradient(to right, #ff0000, #ff00a0, #00ffff, #39ff14, #ffff00, #ff6600, #ff0000, #ff00a0, #00ffff);
      background-size: 200% auto;
      color: transparent !important;
      -webkit-background-clip: text !important;
      background-clip: text !important;
      animation: crazyRainbow 6s ease-in-out infinite alternate;
      padding: 0 15px; 
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.9)) drop-shadow(0 0 30px rgba(0, 240, 255, 1)) drop-shadow(0 0 50px rgba(255, 0, 127, 1)); 
    }
    
    h1 {
      font-family: 'Fredoka', sans-serif; 
      font-weight: 900; 
      font-size: clamp(2.2rem, 6vw, 4.2rem); 
      margin: 0; line-height: 1.2; 
      letter-spacing: 5px; 
      display: flex; justify-content: center; flex-wrap: nowrap;
    }
    
    .char {
      display: inline !important; 
      color: transparent !important;
      text-shadow: none !important;
      animation: none !important; 
    }
    
    @keyframes crazyRainbow {
      0% { background-position: 200% center; }
      100% { background-position: 0% center; }
    }

    .controls-bar { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px; margin-top: 10px; }
    .btn-group { display: flex; background: rgba(0, 0, 0, 0.6); border-radius: var(--radius-large); padding: 4px; border: 1px solid rgba(255, 255, 255, 0.12); position: relative; }
    
    .btn { position: relative; z-index: 1; background: transparent; color: #ccc; border: none; padding: 6px 14px; border-radius: var(--radius-large); font-family: inherit; font-size: 0.85rem; font-weight: 700; transition: color 0.3s ease, background 0.3s ease; }
    .btn:hover { color: #fff; background: rgba(255, 255, 255, 0.15); }
    .btn.active { color: #fff; background: linear-gradient(135deg, var(--google-blue), #00d2ff); box-shadow: 0 0 12px rgba(0, 210, 255, 0.6); }

    .stats-badge {
      font-size: 0.8rem; font-weight: bold; background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2);
    }
    
    .featured-container { max-width: 1600px; margin: 15px auto 10px; padding: 0 15px; }
    .featured-grid { display: grid; grid-template-columns: repeat(1, 1fr); gap: 15px; }
    @media (min-width: 600px) { .featured-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .featured-grid { grid-template-columns: repeat(4, 1fr); } }

    .featured-card {
      position: relative; background: var(--bg-panel); border-radius: 14px; overflow: hidden;
      border: 2px solid var(--neon-cyan); box-shadow: 0 0 18px rgba(0, 240, 255, 0.4), 0 6px 20px rgba(0,0,0,0.8);
      transition: all 0.3s ease; display: flex; flex-direction: column;
    }
    .featured-card:hover { border-color: var(--google-yellow); box-shadow: 0 0 25px rgba(251, 188, 5, 0.6), 0 8px 25px rgba(0,0,0,0.9); transform: translateY(-2px); }
    .featured-card.expanded { grid-column: 1 / -1; max-width: 1000px; margin: 0 auto; width: 100%; }

    .featured-card:fullscreen, .featured-card:-webkit-full-screen, .featured-card.css-fullscreen {
      position: fixed !important; inset: 0 !important; width: 100vw !important; height: 100vh !important;
      max-width: none !important; border-radius: 0 !important; border: none !important; background: #000 !important;
      display: flex !important; flex-direction: column !important; z-index: 9999999 !important; margin: 0 !important;
    }
    .featured-card:fullscreen .featured-header, .featured-card:-webkit-full-screen .featured-header, .featured-card.css-fullscreen .featured-header {
      display: none !important;
    }
    .featured-card:fullscreen .featured-video-box, .featured-card:-webkit-full-screen .featured-video-box, .featured-card.css-fullscreen .featured-video-box {
      flex: 1 !important; aspect-ratio: auto !important; height: 100% !important; overflow: hidden;
    }
    .featured-card:fullscreen .featured-footer, .featured-card:-webkit-full-screen .featured-footer, .featured-card.css-fullscreen .featured-footer {
      position: absolute !important; bottom: 15px !important; right: 15px !important; background: rgba(5,12,30,0.8) !important; border-radius: 12px; z-index: 50; padding: 5px 10px; opacity: 0.3; transition: opacity 0.3s;
    }
    .featured-card:fullscreen:hover .featured-footer, .featured-card:-webkit-full-screen:hover .featured-footer, .featured-card.css-fullscreen:hover .featured-footer {
      opacity: 1;
    }

    .featured-header {
      padding: 8px 12px; background: linear-gradient(90deg, rgba(255,0,127,0.4), rgba(0,240,255,0.4));
      display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 0.88rem; letter-spacing: 0.3px; border-bottom: 1px solid rgba(255,255,255,0.15);
    }
    .featured-header-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
    .featured-footer { padding: 8px 10px; background: rgba(5, 12, 30, 0.9); display: flex; justify-content: flex-end; align-items: center; border-top: 1px solid rgba(255,255,255,0.08); }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    
    .fullscreen-btn {
      background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff; border-radius: 6px; padding: 5px 12px; font-size: 0.8rem; font-family: inherit; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 4px; transition: all 0.2s ease; white-space: nowrap;
    }
    .fullscreen-btn:hover { background: var(--google-blue); border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0, 240, 255, 0.8); }

    .featured-video-box { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #000; }
    .featured-video-box iframe { position: absolute; top: -48px; left: 0; width: 100%; height: calc(100% + 48px); border: none; display: block; z-index: 5; }
    .drive-guard { position: absolute; top: 0; left: 0; width: 100%; height: 48px; z-index: 10; background: transparent; pointer-events: auto; }

    .video-cover-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 12;
      background: linear-gradient(135deg, rgba(7, 13, 30, 0.5) 0%, rgba(12, 28, 66, 0.75) 100%), url('https://wsrv.nl/?url=raw.githubusercontent.com/y3204044-art/camp05485300-gmail.com/main/logo.JPG&w=800') center/cover;
      display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; gap: 10px; transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .video-cover-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .play-trigger-btn { width: 58px; height: 58px; border-radius: 50%; background: linear-gradient(135deg, var(--neon-cyan), var(--neon-pink)); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; color: #fff; box-shadow: 0 0 22px rgba(0, 240, 255, 0.8); transition: transform 0.3s ease; padding-left: 3px; }
    .video-cover-overlay:hover .play-trigger-btn { transform: scale(1.15); }
    .play-trigger-text { font-size: 0.85rem; font-weight: 700; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.9); background: rgba(0,0,0,0.65); padding: 4px 14px; border-radius: 20px; border: 1px solid rgba(0, 240, 255, 0.4); }
    
    .gallery-container { display: grid; padding: 15px 20px 40px; max-width: 1800px; margin: 0 auto; min-height: 200px; perspective: 1000px; }
    .gallery-container[data-size="small"] { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .gallery-container[data-size="medium"] { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
    .gallery-container[data-size="large"] { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    
    .gallery-container.masonry-mode { display: block; column-gap: 12px; }
    .gallery-container.masonry-mode[data-size="small"] { columns: 6 130px; }
    .gallery-container.masonry-mode[data-size="medium"] { columns: 4 220px; }
    .gallery-container.masonry-mode[data-size="large"] { columns: 3 320px; }

    .gallery-container.masonry-mode .media-card { margin-bottom: 12px; break-inside: avoid; display: inline-block; width: 100%; }

    .media-card {
      position: relative; background: linear-gradient(45deg, #0a1532, #16244d); border-radius: 12px; overflow: hidden;
      border: 2px solid #1c2d5a; box-shadow: 0 4px 14px rgba(0,0,0,0.5);
      transition: transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94), box-shadow 0.25s ease, border-color 0.25s ease; z-index: 1;
      background-size: 200% 200%; animation: skeletonPulse 2.5s infinite ease-in-out; cursor: pointer;
      transform-style: preserve-3d;
      will-change: transform;
    }
    
    .media-card::after {
      content: ''; position: absolute; top: 0; left: 0; width: 50%; height: 100%;
      background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0) 100%);
      transform: translateX(-150%) skewX(-25deg); transition: transform 0.6s ease; z-index: 20; pointer-events: none;
    }
    
    @keyframes skeletonPulse { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    
    .media-card:hover { 
      border-color: var(--google-yellow); box-shadow: 0 10px 25px rgba(0,0,0,0.7), 0 0 15px rgba(251, 188, 5, 0.4); z-index: 10; 
    }
    .media-card:hover::after { transform: translateX(250%) skewX(-25deg); }

  <script>
    let isWindowLoaded = document.readyState === 'complete';
    window.addEventListener('load', () => { isWindowLoaded = true; });

    document.addEventListener('contextmenu', e => e.preventDefault());

    document.addEventListener('click', function(e) {
      if(document.body.classList.contains('locked')) return;
      const ripple = document.createElement('div');
      ripple.className = 'ripple';
      ripple.style.left = `${e.clientX - 10}px`; 
      ripple.style.top = `${e.clientY - 10}px`;
      ripple.style.width = '20px';
      ripple.style.height = '20px';
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    });

    window.addEventListener('scroll', () => {
      const scrollPx = document.documentElement.scrollTop;
      const winHeightPx = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const scrolled = `${(scrollPx / winHeightPx) * 100}%`;
      document.getElementById('scroll-progress').style.width = scrolled;
      
      const backToTopBtn = document.getElementById('back-to-top');
      if (scrollPx > 500) backToTopBtn.classList.add('visible');
      else backToTopBtn.classList.remove('visible');
    });

    const passInput = document.getElementById('pass-input');
    passInput.addEventListener('keypress', function(e) { if(e.key === 'Enter') checkPassword(); });

    function checkPassword() {
      if(passInput.value === '123') {
        const gate = document.getElementById('login-gate');
        gate.classList.add('unlocked');
        document.body.classList.remove('locked');
        document.body.classList.add('unlocked');
        setTimeout(() => { 
          gate.style.display = 'none'; 
          initParticles(); 
          if(typeof updateStats === 'function') updateStats(); 
        }, 1000);
      } else {
        const box = document.querySelector('.login-box');
        box.style.animation = 'shakeError 0.4s';
        setTimeout(() => box.style.animation = 'floatBox 4s infinite alternate ease-in-out', 400);
      }
    }

    function initParticles() {
      if(window.tsParticles) {
        tsParticles.load("particles-js", {
          particles: {
            number: { value: 40, density: { enable: true, value_area: 800 } },
            color: { value: ["#00f0ff", "#ff007f", "#ffffff"] },
            shape: { type: "circle" },
            opacity: { value: 0.3, random: true },
            size: { value: 2, random: true },
            move: { enable: true, speed: 0.5, direction: "none", random: true, straight: false, out_mode: "out" }
          },
          interactivity: { detect_on: "canvas", events: { onhover: { enable: false }, onclick: { enable: false } } },
          retina_detect: true
        });
      }
    }

    function shootPartyFirework() {
      const layer = document.getElementById('fireworks-layer');
      if (!layer || !document.body.classList.contains('unlocked')) return;
      
      const fw = document.createElement('div');
      fw.className = 'firework';
      
      const isLeft = Math.random() > 0.5;
      fw.style.left = isLeft ? (Math.random() * 8 + 5) + '%' : (Math.random() * 8 + 87) + '%';
      fw.style.top = (Math.random() * 6 + 2) + '%'; 
      
      const colors = ['#FFD700', '#FF003F', '#00FF7F', '#FFFFFF', '#E0E0E0', '#00F0FF'];
      const baseColor = colors[Math.floor(Math.random() * colors.length)];
      const mixColors = Math.random() > 0.4; 
      
      let shadow = '';
      const particlesCount = 45; 
      for(let i = 0; i < particlesCount; i++) {
        const angle = (i / particlesCount) * Math.PI * 2 + (Math.random() * 0.3);
        const velocity = 10 + Math.random() * 35; 
        const c = mixColors ? colors[Math.floor(Math.random() * colors.length)] : baseColor;
        const x = Math.cos(angle) * velocity;
        const y = Math.sin(angle) * velocity;
        
        const size = Math.random() < 0.15 ? '1.5px' : (Math.random() < 0.5 ? '1px' : '0.5px');
        
        shadow += `${x}px ${y}px 0 ${size} ${c}${i < particlesCount - 1 ? ',' : ''}`;
      }
      
      fw.style.boxShadow = shadow;
      layer.appendChild(fw);
      setTimeout(() => fw.remove(), 1200);
    }
    setInterval(shootPartyFirework, 8000); 

    function toggleCardExpand(btn) {
      const card = btn.closest('.featured-card');
      card.classList.toggle('expanded');
      btn.textContent = card.classList.contains('expanded') ? '✖ מזער' : '🔍 הרחב';
    }

    function toggleCardFullscreen(btn) {
      const card = btn.closest('.featured-card');
      if (card.classList.contains('css-fullscreen')) { card.classList.remove('css-fullscreen'); btn.textContent = '⛶ מסך מלא'; return; }
      if (!document.fullscreenElement) {
        try {
          const req = card.requestFullscreen ? card.requestFullscreen() : (card.webkitRequestFullscreen ? card.webkitRequestFullscreen() : null);
          if (req && req.catch) req.catch(() => { card.classList.add('css-fullscreen'); btn.textContent = '✖ צא'; });
          else if (!req) { card.classList.add('css-fullscreen'); btn.textContent = '✖ צא'; }
        } catch (e) { card.classList.add('css-fullscreen'); btn.textContent = '✖ צא'; }
      } else document.exitFullscreen().catch(()=>{});
    }

    document.addEventListener('fullscreenchange', () => {
      const isFullscreen = !!document.fullscreenElement;
      document.querySelectorAll('.featured-card').forEach(c => {
         const fsBtns = Array.from(c.querySelectorAll('.fullscreen-btn'));
         const btn = fsBtns.find(b => b.textContent.includes('מסך מלא') || b.textContent.includes('צא'));
         if (btn) {
             if (isFullscreen && (document.fullscreenElement === c || c.contains(document.fullscreenElement))) {
                 btn.textContent = '✖ צא';
             } else {
                 c.classList.remove('css-fullscreen');
                 btn.textContent = '⛶ מסך מלא';
             }
         }
      });
    });

    let lastScroll = 0; const header = document.getElementById('main-header');
    window.addEventListener('scroll', () => {
      const currentScroll = window.scrollY;
      if (currentScroll > 80) header.classList.add('hidden'); else header.classList.remove('hidden');
      lastScroll = currentScroll;
    });

    let allMedia = [], filteredMedia = [], currentBatchIndex = 0, currentLightboxIndex = -1;
    const BATCH_SIZE = 24, galleryEl = document.getElementById('gallery'), sentinel = document.getElementById('scroll-sentinel');
    let isRendering = false;

    const lazyMediaObserver = new IntersectionObserver((entries, obs) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const media = entry.target;
          if (media.dataset.src) {
            media.src = media.dataset.src;
            media.onload = () => media.classList.add('loaded');
            media.onloadeddata = () => media.classList.add('loaded');
            if (media.readyState >= 1) media.classList.add('loaded');
            media.removeAttribute('data-src');
          }
          obs.unobserve(media);
        }
      });
    }, { rootMargin: '800px' });

    async function fetchFromGitHub() {
      let filePaths = [];
      try {
        const res = await fetch('https://api.github.com/repos/y3204044-art/camp05485300-gmail.com/git/trees/main?recursive=1');
        if (res.ok) { const data = await res.json(); if (data && data.tree) filePaths = data.tree.filter(f => f.type === 'blob').map(f => f.path); }
      } catch (err) {}

      if (filePaths.length === 0) {
        try {
          const res = await fetch('https://data.jsdelivr.com/v1/packages/gh/y3204044-art/camp05485300-gmail.com@main?structure=flat');
          if (res.ok) { const data = await res.json(); if (data && data.files) filePaths = data.files.map(f => f.name.replace(/^\//, '')); }
        } catch (err) {}
      }

      const mediaPaths = filePaths.filter(path => 
        path.match(/\.(jpg|jpeg|png|webp|mp4|webm|mov|m4v|ogg)$/i) && 
        path !== '741b9b95-a1e6-4dca-af27-be8248308207.mp4'
      );
      if (mediaPaths.length === 0) return;

      allMedia = mediaPaths.map(path => {
        const encodedPath = path.split('/').map(encodeURIComponent).join('/');
        const isVideo = !!path.match(/\.(mp4|webm|mov|m4v|ogg)$/i);
        
        // התיקון הסופי לבעיית המסך השחור: סרטונים מעל 20MB חייבים לרוץ דרך Github Raw המקורי.
        // תמונות לעומת זאת, יכולות (וצריכות) לרוץ דרך שרת ה-CDN המהיר כדי להפוך ל-WebP.
        const rawVideoUrl = `https://raw.githubusercontent.com/y3204044-art/camp05485300-gmail.com/main/${encodedPath}`;
        const imgCdnUrl = `https://cdn.jsdelivr.net/gh/y3204044-art/camp05485300-gmail.com@main/${encodedPath}`;
        
        const finalUrl = isVideo ? rawVideoUrl : imgCdnUrl;
        
        // טריק הפריים: טעינת 0.001 שניות מהוידאו לגלריה. ולתמונות: המרה ל-WebP.
        const thumbUrl = isVideo ? `${rawVideoUrl}#t=0.001` : `https://wsrv.nl/?url=${encodeURIComponent(imgCdnUrl)}&w=400&q=60&output=webp`;
        
        return { url: finalUrl, isVideo, thumb: thumbUrl, id: path };
      });
      
      allMedia.sort(() => Math.random() - 0.5); filteredMedia = [...allMedia];
      updateStats();
      galleryEl.innerHTML = ''; currentBatchIndex = 0; await checkAndLoadMore();
    }
    
    let statsAnimationId = null;
    function updateStats() {
      const targetImgCount = allMedia.filter(m => !m.isVideo).length;
      const targetVidCount = allMedia.filter(m => m.isVideo).length;
      const statsEl = document.getElementById('media-stats');
      
      if (statsAnimationId) cancelAnimationFrame(statsAnimationId);
      
      let startTimestamp = null;
      const duration = 3000; 
      
      const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        
        const easeOutCubic = 1 - Math.pow(1 - progress, 3);
        
        const currentImg = Math.floor(easeOutCubic * targetImgCount);
        const currentVid = Math.floor(easeOutCubic * targetVidCount);
        
        statsEl.textContent = `תמונות: ${currentImg} | סרטונים: ${currentVid}`;
        
        if (progress < 1) {
          statsAnimationId = window.requestAnimationFrame(step);
        } else {
          statsEl.textContent = `תמונות: ${targetImgCount} | סרטונים: ${targetVidCount}`;
        }
      };
      
      statsAnimationId = window.requestAnimationFrame(step);
    }

    async function renderBatch() {
      if (isRendering || currentBatchIndex >= filteredMedia.length) return;
      isRendering = true;
      const fragment = document.createDocumentFragment();
      const end = Math.min(currentBatchIndex + BATCH_SIZE, filteredMedia.length);
      
      for (let i = currentBatchIndex; i < end; i++) {
        const item = filteredMedia[i];
        const card = document.createElement('div');
        card.className = 'media-card interactable';
        card.onclick = () => openLightbox(i);
        
        let tiltTimeout;
        card.addEventListener('mousemove', (e) => {
           if(tiltTimeout) return;
           tiltTimeout = requestAnimationFrame(() => {
             const rect = card.getBoundingClientRect();
             const x = e.clientX - rect.left;
             const y = e.clientY - rect.top;
             const centerX = rect.width / 2;
             const centerY = rect.height / 2;
             const rotateX = ((y - centerY) / centerY) * -3; 
             const rotateY = ((x - centerX) / centerX) * 3;
             card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.015, 1.015, 1.015)`;
             tiltTimeout = null;
           });
        });
        card.addEventListener('mouseleave', () => {
           if(tiltTimeout) { cancelAnimationFrame(tiltTimeout); tiltTimeout = null; }
           card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
        });

        if (item.isVideo) {
          const video = document.createElement('video');
          video.dataset.src = item.thumb; video.className = 'media-item'; 
          video.muted = true; video.loop = true; 
          video.preload = 'metadata'; // מושך רק את הפריים הראשון
          video.setAttribute('playsinline', '');
          video.setAttribute('decoding', 'async');
          
          video.addEventListener('loadedmetadata', function() {
            if(this.duration && this.duration !== Infinity) {
                const m = Math.floor(this.duration / 60);
                const s = Math.floor(this.duration % 60).toString().padStart(2, '0');
                const tag = document.createElement('div');
                tag.className = 'video-duration-tag';
                tag.innerText = `${m}:${s}`;
                card.appendChild(tag);
            }
          });

          let playPromise;
          card.onmouseenter = () => { playPromise = video.play().catch(()=>{}); };
          card.onmouseleave = () => { if(playPromise) playPromise.then(()=>video.pause()).catch(()=>{}); video.currentTime = 0; };
          card.appendChild(video);
          const icon = document.createElement('div'); icon.className = 'video-icon'; icon.innerHTML = '▶'; card.appendChild(icon);
          lazyMediaObserver.observe(video);
        } else {
          const img = document.createElement('img');
          img.className = 'media-item'; img.dataset.src = item.thumb;
          img.setAttribute('decoding', 'async');
          img.onerror = () => { img.src = item.url; };
          card.appendChild(img); lazyMediaObserver.observe(img);
        }
        fragment.appendChild(card);
      }
      galleryEl.appendChild(fragment); currentBatchIndex = end; isRendering = false;
    }

    async function checkAndLoadMore() {
      if (isRendering || currentBatchIndex >= filteredMedia.length) return;
      const scrollBottom = window.innerHeight + window.scrollY;
      const docHeight = document.documentElement.scrollHeight || document.documentElement.offsetHeight;
      if (docHeight - scrollBottom < 1200 || window.innerHeight >= docHeight) { await renderBatch(); setTimeout(checkAndLoadMore, 100); }
    }
    window.addEventListener('scroll', checkAndLoadMore, { passive: true });
    window.addEventListener('resize', checkAndLoadMore, { passive: true });
    new IntersectionObserver(entries => { if (entries[0].isIntersecting) checkAndLoadMore(); }, { rootMargin: '800px 0px' }).observe(sentinel);

    function setSize(size, btn) { document.querySelector('.gallery-container').setAttribute('data-size', size); updateActiveBtn(btn); checkAndLoadMore(); }
    function setLayout(layout, btn) { const gal = document.querySelector('.gallery-container'); if (layout === 'masonry') gal.classList.add('masonry-mode'); else gal.classList.remove('masonry-mode'); updateActiveBtn(btn); checkAndLoadMore(); }
    async function setFilter(type, btn) {
      const featSec = document.getElementById('featured-section');
      if (type === 'images') { filteredMedia = allMedia.filter(m => !m.isVideo); if (featSec) featSec.style.display = 'none'; } 
      else if (type === 'videos') { filteredMedia = allMedia.filter(m => m.isVideo); if (featSec) featSec.style.display = 'block'; } 
      else { filteredMedia = allMedia; if (featSec) featSec.style.display = 'block'; }
      galleryEl.innerHTML = ''; currentBatchIndex = 0; updateActiveBtn(btn); await checkAndLoadMore();
    }
    function updateActiveBtn(btn) { Array.from(btn.parentElement.children).forEach(b => b.classList.remove('active')); btn.classList.add('active'); }

    const lightbox = document.getElementById('lightbox'), lbContainer = document.getElementById('lightbox-media-container');

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox || e.target === lbContainer) closeLightbox(e);
    });

    function openLightbox(index) { 
      if (index < 0 || index >= filteredMedia.length) return;
      currentLightboxIndex = index; 
      lightbox.classList.add('active'); 
      document.body.classList.add('no-scroll'); 
      renderLightboxContent(filteredMedia[currentLightboxIndex]); 
    }

    function renderLightboxContent(item) {
      lbContainer.innerHTML = ''; 
      const loader = document.getElementById('lightbox-loader'); 
      if (loader) loader.style.display = 'block';
      
      if (item.isVideo) { 
        const vWrap = document.createElement('div');
        vWrap.className = 'custom-video-container loading';
        
        vWrap.oncontextmenu = (e) => { e.preventDefault(); return false; };
        
        // הוידאו מוזרם מהשרת המקורי עכשיו בלי חסימות CrossOrigin
        vWrap.innerHTML = `
          <video id="plyr-player" playsinline controls controlsList="nodownload" autoplay oncontextmenu="return false;">
            <source src="${item.url}" type="video/mp4" />
          </video>
        `;
        lbContainer.appendChild(vWrap);
        
        const initFallbackPlayer = () => {
          const fallbackVideo = vWrap.querySelector('video');
          fallbackVideo.autoplay = true;
          fallbackVideo.oncanplay = () => { if (loader) loader.style.display = 'none'; vWrap.classList.remove('loading'); fallbackVideo.play().catch(()=>{}); };
          fallbackVideo.onwaiting = () => { if (loader) loader.style.display = 'block'; };
          fallbackVideo.onplaying = () => { if (loader) loader.style.display = 'none'; };
        };

        if (typeof Plyr !== 'undefined') {
          try {
            const player = new Plyr('#plyr-player', {
              controls: ['play-large', 'play', 'progress', 'current-time', 'duration', 'mute', 'volume', 'fullscreen'],
              autoplay: true,
              disableContextMenu: true, 
              keyboard: { focused: true, global: true },
              iconUrl: 'https://cdnjs.cloudflare.com/ajax/libs/plyr/3.7.8/plyr.svg'
            });

            vWrap.plyrInstance = player;
            
            player.on('ready', () => { vWrap.classList.remove('loading'); });
            player.on('canplay', () => { if (loader) loader.style.display = 'none'; });
            player.on('playing', () => { if (loader) loader.style.display = 'none'; });
            player.on('waiting', () => { if (loader) loader.style.display = 'block'; });
            player.on('error', () => { 
              if (loader) loader.style.display = 'none';
              console.warn("התרחשה שגיאה בנגן Plyr, עובר לנגן גיבוי.");
              initFallbackPlayer();
            });
          } catch (e) {
            initFallbackPlayer();
          }
        } else {
          initFallbackPlayer();
        }
        
      } else { 
        const elem = document.createElement('img'); 
        elem.onload = () => { if (loader) loader.style.display = 'none'; }; 
        elem.src = `https://wsrv.nl/?url=${encodeURIComponent(item.url)}&w=1600&q=80&output=webp`; 
        elem.id = 'lightbox-content'; 
        elem.oncontextmenu = () => false;
        elem.ondragstart = () => false;
        lbContainer.appendChild(elem);
      }
    }

    function navigateLightbox(dir, event) {
      if(event) event.stopPropagation();
      if (currentLightboxIndex === -1) return;
      currentLightboxIndex += dir;
      if (currentLightboxIndex < 0) currentLightboxIndex = filteredMedia.length - 1;
      if (currentLightboxIndex >= filteredMedia.length) currentLightboxIndex = 0;
      renderLightboxContent(filteredMedia[currentLightboxIndex]);
    }

    function closeLightbox(event) { 
      if(event) event.stopPropagation();
      lightbox.classList.remove('active'); 
      document.body.classList.remove('no-scroll');
      currentLightboxIndex = -1; 
      
      const vWrap = lbContainer.querySelector('.custom-video-container');
      if (vWrap && vWrap.plyrInstance) { 
        vWrap.plyrInstance.destroy(); 
      } else {
        const video = lbContainer.querySelector('video');
        if(video) { video.pause(); video.removeAttribute('src'); video.load(); }
      }
      
      lbContainer.innerHTML = ''; 
    }
    
    document.addEventListener('keydown', (e) => {
      if (lightbox.classList.contains('active')) {
        if (e.key === 'ArrowLeft') navigateLightbox(1, e);
        else if (e.key === 'ArrowRight') navigateLightbox(-1, e);
        else if (e.key === 'Escape') closeLightbox(e);
      }
    });

    let touchStartX = 0;
    lightbox.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, {passive: true});
    lightbox.addEventListener('touchend', e => {
      if (!lightbox.classList.contains('active')) return;
      const touchEndX = e.changedTouches[0].screenX;
      if (touchEndX < touchStartX - 50) navigateLightbox(1);
      if (touchEndX > touchStartX + 50) navigateLightbox(-1);
    }, {passive: true});

    let slideshowInterval = null;
    let slideshowImages = [];
    let slideshowCurrentIdx = 0;

    function startSlideshow() {
      slideshowImages = allMedia.filter(m => !m.isVideo);
      if (slideshowImages.length === 0) return;
      
      for (let i = slideshowImages.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [slideshowImages[i], slideshowImages[j]] = [slideshowImages[j], slideshowImages[i]];
      }
      
      slideshowCurrentIdx = 0;
      document.getElementById('slideshow-overlay').classList.add('active');
      document.body.classList.add('no-scroll');
      
      const bgMusic = document.getElementById('slideshow-audio');
      if (bgMusic) {
        bgMusic.currentTime = 0;
        bgMusic.volume = 1.0;
        bgMusic.play().catch(e => console.log("הדפדפן חסם את ניגון המוזיקה.", e));
      }
      
      showNextSlide();
      slideshowInterval = setInterval(showNextSlide, 4500); 
    }

    function showNextSlide() {
      const imgEl = document.getElementById('slideshow-img');
      imgEl.classList.remove('show'); 
      
      setTimeout(() => {
        imgEl.src = `https://wsrv.nl/?url=${encodeURIComponent(slideshowImages[slideshowCurrentIdx].url)}&w=1600&q=80&output=webp`;
        imgEl.onload = () => {
          imgEl.classList.add('show'); 
        };
        slideshowCurrentIdx = (slideshowCurrentIdx + 1) % slideshowImages.length;
      }, 800); 
    }

    function stopSlideshow(event) {
      if(event) event.stopPropagation();
      clearInterval(slideshowInterval);
      
      const bgMusic = document.getElementById('slideshow-audio');
      if (bgMusic) bgMusic.pause();
      
      document.getElementById('slideshow-overlay').classList.remove('active');
      document.body.classList.remove('no-scroll');
      document.getElementById('slideshow-img').classList.remove('show');
    }
    
    document.addEventListener('keydown', (e) => {
       if (e.key === 'Escape' && document.getElementById('slideshow-overlay').classList.contains('active')) {
           stopSlideshow(e);
       }
    });

    let dataLoaded = false;

    function runBootSequence() {
      const bootUi = document.getElementById('system-boot-ui');
      const formContainer = document.getElementById('login-form-container');
      const consoleHistory = document.getElementById('console-history');
      const consoleCursor = document.getElementById('console-cursor');
      const progressFill = document.getElementById('progress-fill');
      const percentageText = document.getElementById('loading-percentage');

      if (!bootUi || !consoleHistory) return; 

      const dataPromise = fetchFromGitHub();
      dataPromise.then(() => { dataLoaded = true; }).catch(() => { dataLoaded = true; });

      const messages = [
        { text: "מאתחל מערכות ליבה ופרוטוקולי אבטחה...", type: "normal", baseDelay: 800 },
        { text: "מקים ערוץ תקשורת מאובטח מול השרת...", type: "normal", baseDelay: 1200 },
        { text: "החיבור הוצפן בהצלחה (Port 443)", type: "success", baseDelay: 900 },
        { text: "מאמת הרשאות ואישורי כניסה...", type: "normal", baseDelay: 1500 },
        { text: "עוקף חומת אש אזורית (Firewall Bypass)...", type: "warning", baseDelay: 2000 },
        { text: "ממתין לסנכרון נתונים מהשרת הראשי...", type: "normal", baseDelay: 2500 },
        { text: "פורק קבצי מדיה לזיכרון המטמון...", type: "warning", baseDelay: 2000 },
        { text: "מעבד תצוגה מקדימה ווידאו...", type: "normal", baseDelay: 2000 },
        { text: "מרכיב ממשק משתמש (UI)...", type: "normal", baseDelay: 1500 },
        { text: "ממתין לאישור טעינה סופי מהדפדפן...", type: "warning", baseDelay: 3000 }
      ];

      let msgIndex = 0;
      function printNextMessage() {
          if (msgIndex >= messages.length) return;
          const msg = messages[msgIndex];
          const lineElement = document.createElement('div');
          lineElement.className = 'console-line ' + (msg.type !== 'normal' ? msg.type : '');
          lineElement.textContent = '> ' + msg.text;
          consoleHistory.insertBefore(lineElement, consoleCursor);
          
          const lines = consoleHistory.querySelectorAll('.console-line');
          if (lines.length > 6) { consoleHistory.removeChild(lines[0]); }
          msgIndex++;
          
          let delay = msg.baseDelay;
          if (!dataLoaded || !isWindowLoaded) delay *= 1.3; 
          else delay = 200; 

          if (msgIndex < messages.length) setTimeout(printNextMessage, delay);
      }
      setTimeout(printNextMessage, 300);

      let progress = 0;
      const startTime = performance.now();
      const targetTimeFor90 = 15000; 

      function updateProgress(currentTime) {
        const elapsed = currentTime - startTime;
        
        const systemReady = dataLoaded && isWindowLoaded && (elapsed > 2000); 

        if (systemReady && progress >= 90) { 
           progress += (100 - progress) * 0.15; 
        } else {
           if (elapsed < targetTimeFor90) {
               progress = (elapsed / targetTimeFor90) * 90;
           } else {
               progress += (99 - progress) * 0.002;
           }
        }

        if (progress > 99.9 && systemReady) progress = 100;
        if (progress > 99 && !systemReady) progress = 99; 

        if (progressFill) progressFill.style.width = progress + '%';
        if (percentageText) {
            percentageText.textContent = (progress === 100 ? "100.00" : progress.toFixed(2)) + '%';
        }

        if (progress >= 100) {
          const lineElement = document.createElement('div');
          lineElement.className = 'console-line success';
          lineElement.textContent = '> המערכת סונכרנה ונטענה במלואה! פותח שערים...';
          consoleHistory.insertBefore(lineElement, consoleCursor);
          const lines = consoleHistory.querySelectorAll('.console-line');
          if (lines.length > 6) consoleHistory.removeChild(lines[0]);
          
          setTimeout(() => {
            if (bootUi) bootUi.style.display = 'none';
            if (formContainer) {
              formContainer.style.display = 'flex';
              formContainer.style.animation = 'glowingFadeIn 1.5s cubic-bezier(0.25, 1, 0.25, 1) forwards';
            }
          }, 800);
        } else {
          requestAnimationFrame(updateProgress);
        }
      }
      
      requestAnimationFrame(updateProgress);
    }

    runBootSequence();
  </script>
</body>
</html>
